    nodeTitle: n=>({tag:n.code, sub:tr("bfd."+n.code), icon:"▦"}),
    linkColor: ()=>getComputedStyle(document.documentElement).getPropertyValue("--stream").trim() || "#0f766e",
    streamNumber: ()=>null,
    onDirty: ()=>touchProject(),
    onDelete: (type, uid_)=>{
      if (type === "node"){
        d.bfd.nodes = d.bfd.nodes.filter(z=>z.uid !== uid_);
        d.bfd.links = d.bfd.links.filter(l=>l.src !== uid_ && l.dst !== uid_);
      } else {
        d.bfd.links = d.bfd.links.filter(z=>z.uid !== uid_);
      }
      touchProject(); paintAll();
    },
    onLink: (src, dst)=>{
      d.bfd.counter = (d.bfd.counter||0) + 1;
      d.bfd.links.push({uid:"l"+d.bfd.counter, src, dst});
      touchProject(); paintAll();
    },
    onNodeCtx: (uid_, x, y)=>{
      const n = d.bfd.nodes.find(z=>z.uid === uid_);
      if (!n || !isWritable()) return;
      ctxMenu(x, y, [{label:tr("bfd.menu_del_node"), onClick:()=>{
        d.bfd.nodes = d.bfd.nodes.filter(z=>z.uid !== n.uid);
        d.bfd.links = d.bfd.links.filter(l=>l.src !== n.uid && l.dst !== n.uid);
        touchProject(); paintAll();
      }}]);
    },
    onStreamCtx: (uid_, x, y)=>{
      const l = d.bfd.links.find(z=>z.uid === uid_);
      if (!l || !isWritable()) return;
      ctxMenu(x, y, [{label:tr("bfd.menu_del_link"), onClick:()=>{
        d.bfd.links = d.bfd.links.filter(z=>z.uid !== l.uid);
        touchProject(); paintAll();
      }}]);
    },
  });
  document.addEventListener("keydown", BFD_CANVAS._key = e=>{
    if (CURRENT_PAGE !== "bfd" || !BFD_CANVAS) return;
    const tag = document.activeElement?.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (document.querySelector(".modal-back")) return;
    if (e.key === "Delete" && isWritable()) BFD_CANVAS.deleteSelection();

  root.querySelector("#bfd-del").addEventListener("click", ()=>{ if (requireWrite()) BFD_CANVAS.deleteSelection(); });
  root.querySelector("#bfd-clear").addEventListener("click", ()=>{

  root.querySelector("#bfd-png").addEventListener("click", ()=>{
    if (!d.bfd.nodes.length){ toast(tr("png.empty")); return; }
    BFD_CANVAS.fit();
    setTimeout(()=>{
      /* render the canvas viewport to PNG via SVG serialization + canvas */
      const holderEl = document.getElementById("bfd-canvas");
      const vp = holderEl.querySelector(".cv-viewport");
      const svg = holderEl.querySelector(".cvsvg");
      const rect = holderEl.getBoundingClientRect();
      const cnv = document.createElement("canvas");
      cnv.width = rect.width * 2; cnv.height = rect.height * 2;
      const ctx = cnv.getContext("2d");
      ctx.scale(2, 2);
      const cs = getComputedStyle(document.documentElement);
      ctx.fillStyle = cs.getPropertyValue("--canvas-bg").trim() || "#e8edf4";
      ctx.fillRect(0, 0, rect.width, rect.height);
      /* draw dot grid */
      ctx.fillStyle = cs.getPropertyValue("--canvas-dot").trim() || "#c9d4e2";
      for (let gx=0; gx<rect.width; gx+=22) for (let gy=0; gy<rect.height; gy+=22) ctx.fillRect(gx, gy, 1.4, 1.4);
      /* streams first */
      const dd = d.bfd;
      const nodes = {}; for (const n of dd.nodes) nodes[n.uid] = n;
      const edgesOf = n=>({t:{x:n.x+75, y:n.y}, b:{x:n.x+75, y:n.y+56},
        l:{x:n.x, y:n.y+28}, r:{x:n.x+150, y:n.y+28}});
      /* draw with the live canvas transform */
      const m2 = parseTransform(holderEl.querySelector(".cv-viewport"));
      ctx.save();
      ctx.translate(m2.tx, m2.ty);
      ctx.scale(m2.scale, m2.scale);
      ctx.strokeStyle = cs.getPropertyValue("--stream").trim() || "#0f766e";
      ctx.lineWidth = 2.2 / m2.scale;
      for (const l of dd.links){
        const a = nodes[l.src], b = nodes[l.dst];
        if (!a || !b) continue;
        const ea = edgesOf(a), eb = edgesOf(b);
        let best = null, bd = 1e18;
        for (const ka of Object.keys(ea)) for (const kb of Object.keys(eb)){
          const dx = ea[ka].x - eb[kb].x, dy = ea[ka].y - eb[kb].y;
          const ds = dx*dx + dy*dy;
          if (ds < bd){ bd = ds; best = [ea[ka], eb[kb]]; }
        }
        ctx.beginPath();
        ctx.moveTo(best[0].x, best[0].y);
        ctx.lineTo(best[1].x, best[1].y);
        ctx.stroke();
        /* arrow head */
        const ang = Math.atan2(best[1].y-best[0].y, best[1].x-best[0].x);
        ctx.beginPath();
        ctx.moveTo(best[1].x, best[1].y);
        ctx.lineTo(best[1].x - 10*Math.cos(ang-0.45), best[1].y - 10*Math.sin(ang-0.45));
        ctx.lineTo(best[1].x - 10*Math.cos(ang+0.45), best[1].y - 10*Math.sin(ang+0.45));
        ctx.closePath();
        ctx.fillStyle = cs.getPropertyValue("--stream").trim() || "#0f766e";
        ctx.fill();
      }
      for (const n of dd.nodes){
        const u = BFD_UNITS.find(x=>x.code === n.code);
        ctx.fillStyle = cs.getPropertyValue("--node-bg").trim() || "#fff";
        ctx.strokeStyle = cs.getPropertyValue("--node-border").trim() || "#94a3b8";
        ctx.lineWidth = 1.6 / m2.scale;
        roundRect(ctx, n.x, n.y, 150, 56, 9); ctx.fill(); ctx.stroke();
        ctx.fillStyle = cs.getPropertyValue("--text").trim() || "#0f172a";
        ctx.font = "bold 13px Vazirmatn, Tahoma, sans-serif";
        ctx.fillText(n.code, n.x + 12, n.y + 22);
        ctx.font = "11px Vazirmatn, Tahoma, sans-serif";
        ctx.fillStyle = cs.getPropertyValue("--text2").trim() || "#475569";
        const nm = LANG === "en" ? (u?u.en:n.code) : (u?tr(u.i18n):n.code);
        ctx.fillText(nm, n.x + 12, n.y + 40, 130);
      }
      ctx.restore();
      const a = document.createElement("a");
      a.href = cnv.toDataURL("image/png");
      a.download = "faravariyar_bfd.png";
      a.click();
    }, 120);
  });
  function parseTransform(el){
    const t = el.style.transform || "";
    const m1 = /translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(t);
    const m2 = /scale\(([\d.]+)\)/.exec(t);
    return {tx: m1 ? parseFloat(m1[1]) : 0, ty: m1 ? parseFloat(m1[2]) : 0, scale: m2 ? parseFloat(m2[1]) : 1};
  }
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function paintAll(){
    BFD_CANVAS.paint();
    const st = root.querySelector("#bfd-stats");
    if (st) st.innerHTML = `<span>${LANG === "fa"
      ? `واحدها: ${d.bfd.nodes.length} — اتصال‌ها: ${d.bfd.links.length}`
      : `Units: ${d.bfd.nodes.length} — Links: ${d.bfd.links.length}`}</span>`;
  }
  paintAll();
}

function prdGenerate(d){
  if (!d.crd.streams.length) return tr("prd.no_streams");
  const nodes = {}; for (const n of d.crd.nodes) nodes[n.uid] = n;
  const tons = bal_compute_tons(d);
  const waters = bal_compute_water(d, tons);
  const sizes = bal_compute_sizes(d, tons);
  const lines = [tr("prd.header"), ""];
  d.crd.streams.forEach((s, i)=>{
    const a = nodes[s.src], b = nodes[s.dst];
    let line = trf("prd.line", i+1, a ? a.tag : "?", b ? b.tag : "?");
    if (s.name) line += trf("prd.with_name", s.name);
    const details = [];
    const t = isWaterStream(s) ? null : tons[s.uid];
    if (t !== null && t !== undefined) details.push(trf("prd.det.ton", fmtN(t)));
    const wv = parseNum(s.water) !== null ? parseNum(s.water) : waters[s.uid];
    if (wv !== null && wv !== undefined) details.push(trf("prd.det.water", fmtN(wv)));
    const sv = s.manual?.size ? parseNum(s.manual.size) : sizes[s.uid];
    if (sv !== null && sv !== undefined) details.push(trf("prd.det.size", fmtN(sv)));
    if (t !== null && t !== undefined && wv !== null && wv !== undefined){
      const sp = bal_solids_pct(t, wv);
      if (sp !== null) details.push(trf("prd.det.solids", fmtN(sp)));
    }
    if (details.length) line += tr("prd.details") + " " + details.join(" — ") + ".";
    lines.push(line);
  });
  return lines.join("\n");
}

/* ==================== PAGE: COD ==================== */
const COD_TOKENS = ["AREA","ABBR","NUM","SEQ"];
let COD_DICT_TAB = "area";
function codPreview(c){
  const parts = c.pattern.filter(Boolean);
  if (!parts.length) return tr("cod.no_tokens");
  const join = c.sep ? "-" : "";
  return parts.map(p=>{
    if (p === "AREA") return c.area || "14";
    if (p === "ABBR") return "BM";
    if (p === "NUM") return "2120";
    if (p === "SEQ"){
      const start = parseNum(c.seqStart) || 1;
      const pad = parseNum(c.seqPad) || 2;
      return String(Math.round(start)).padStart(Math.round(pad), "0");
    }
    return p;
  }).join(join);
}
function codAssign(d){
  /* section-by-section: AREA by BFD section, SEQ restarts per section */
  const parts = d.cod.pattern.filter(Boolean);
  const join = d.cod.sep ? "-" : "";
  const seqStart = Math.round(parseNum(d.cod.seqStart) || 1);
  const seqPad = Math.round(parseNum(d.cod.seqPad) || 2);
  const perSection = {};
  let seqAll = seqStart;
  const dictArea = d.cod.dicts.area;
  for (const n of d.crd.nodes){
    const comps = [];
    const section = unit_of_equipment(n.code);
    for (const p of parts){
      if (p === "AREA"){
        const row = dictArea.find(r=>r[0] === (UNIT_AREA[section] || ""));
        comps.push(row ? row[0] : (d.cod.area || "00"));
      } else if (p === "ABBR"){
        comps.push(ABBR_MAP[n.code] || n.code);
      } else if (p === "NUM"){
        comps.push("0000");
      } else if (p === "SEQ"){
        if (!d.cod.area){
          const key = section || "_";
          perSection[key] = (perSection[key] || seqStart);
          comps.push(String(perSection[key]).padStart(seqPad, "0"));
          perSection[key]++;
        } else {
          comps.push(String(seqAll).padStart(seqPad, "0"));
          seqAll++;
        }
      } else comps.push(p);
    }
    n.tag = comps.join(join);
  }
  touchProject();
}

        </div>

        <div style="max-width:220px">
          <label class="fld">${esc(tr("cod.area"))}</label>

            <option value="">—</option>

          <label class="fld">${esc(tr("cod.seq_rule"))}</label>

            <input class="inp" id="cod-seqpad" dir="ltr" style="width:70px" value="${esc(c.seqPad)}" ${ro()}>

        <div style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="cod-sep" ${c.sep?"checked":""} ${ro()}>
          <span style="font-size:13px">${esc(tr("cod.sep"))}</span>
        </div>
      </div>
      <div style="margin-top:14px">
        <div class="calc-note">${esc(tr("cod.preview"))}</div>
        <div class="cod-preview" id="cod-prev"></div>
        <div class="calc-note" id="cod-sample"></div>
      </div>
      <button class="btn primary" id="cod-apply" style="margin-top:10px" ${ro()}>✓ ${esc(tr("cod.apply"))}</button>
    </div>
    <div class="card">
      <div class="card-head"><span class="badge gray">COD</span><h3>${esc(tr("cod.dict"))}</h3>
        <div class="spacer"></div>
        <div class="flexrow">
          ${["area","abbr"].map(t=>`<button class="btn small ${COD_DICT_TAB===t?"primary":""}" data-dt="${t}">${esc(tr(t==="area"?"cod.tab.area":"cod.tab.abbr"))}</button>`).join("")}
        </div>
      </div>
      <div class="calc-note">${esc(tr("cod.dict_hint"))}</div>
      <div id="cod-dict"></div>
    </div>`;
  function paintSlots(){
    const slots = root.querySelector("#cod-slots");
    slots.innerHTML = "";
    c.pattern.forEach((p, i)=>{
      if (i > 0 && c.sep){
        const sep = document.createElement("span");
        sep.className = "slotsep"; sep.textContent = "-";
        slots.appendChild(sep);
      }
      const s = document.createElement("div");
      s.className = "slot" + (p ? " filled" : "");
      s.title = tr("cod.slot_clear");
      s.textContent = p ? tr("cod.tok."+p) : tr("cod.empty_slot");
      s.addEventListener("dblclick", ()=>{
        if (!requireWrite()) return;
        c.pattern.splice(i, 1); touchProject(); paintSlots(); paintPreview();
      });
      slots.appendChild(s);
    });
  }
  function paintPreview(){
    root.querySelector("#cod-prev").textContent = codPreview(c);
    const n0 = d.crd.nodes[0];
    root.querySelector("#cod-sample").textContent = n0
      ? trf("cod.sample", n0.tag || n0.code) + " " + codAssignPreviewOne(c, n0)
      : "";
    const start = Math.round(parseNum(c.seqStart) || 1);
    const pad = Math.round(parseNum(c.seqPad) || 2);
    root.querySelector("#cod-seqex").textContent =
      trf("cod.seq_example_live",
        String(start).padStart(pad,"0"), String(start+1).padStart(pad,"0"));
  }
  function codAssignPreviewOne(c, n){
    const parts = c.pattern.filter(Boolean);
    const join = c.sep ? "-" : "";
    const section = unit_of_equipment(n.code);
    return parts.map(p=>{
      if (p === "AREA") return UNIT_AREA[section] || c.area || "00";
      if (p === "ABBR") return ABBR_MAP[n.code] || n.code;
      if (p === "NUM") return "0000";
      if (p === "SEQ") return String(Math.round(parseNum(c.seqStart)||1)).padStart(Math.round(parseNum(c.seqPad)||2), "0");
      return p;
    }).join(join);
  }
  root.querySelectorAll("[data-tok]").forEach(b=>{
    b.addEventListener("click", ()=>{
      if (!requireWrite()) return;
      if (c.pattern.length >= 5){ return; }
      c.pattern.push(b.dataset.tok);
      touchProject(); paintSlots(); paintPreview();
    });
  });
  root.querySelector("#cod-area").addEventListener("change", e=>{
    if (!requireWrite()) return;
    c.area = e.target.value; touchProject(); paintPreview();
  });
  root.querySelector("#cod-seqstart").addEventListener("change", e=>{
    if (!requireWrite()) return;
    c.seqStart = e.target.value; touchProject(); paintPreview();
  });
  root.querySelector("#cod-seqpad").addEventListener("change", e=>{
    if (!requireWrite()) return;
    c.seqPad = e.target.value; touchProject(); paintPreview();
  });
  root.querySelector("#cod-sep").addEventListener("change", e=>{
    if (!requireWrite()) return;
    c.sep = e.target.checked; touchProject(); paintSlots(); paintPreview();
  });
  root.querySelector("#cod-apply").addEventListener("click", ()=>{
    if (!requireWrite()) return;
    if (!d.crd.nodes.length){ toast(tr("eql.empty")); return; }
    codAssign(d);
    paintPreview();
    toast(trf("cod.assigned", d.crd.nodes.length));
    go("cod");
  });
  function paintDict(){
    const el = root.querySelector("#cod-dict");
    const rows = c.dicts[COD_DICT_TAB];
    el.innerHTML = `
      <div class="tblwrap" style="max-height:320px"><table class="tbl">
        <thead><tr>
          <th style="width:110px">${esc(tr("col.dict_code"))}</th>
          <th>${esc(tr("col.dict_item"))}</th>
          <th style="width:90px"></th>
        </tr></thead><tbody></tbody>
      </table></div>
      <div class="flexrow" style="margin-top:10px">
        <button class="btn small" id="cod-addrow" ${ro()}>＋ ${esc(tr("cod.add_row"))}</button>
      </div>`;
    const tb = el.querySelector("tbody");
    rows.forEach((r, i)=>{
      const trEl = document.createElement("tr");
      trEl.innerHTML = `
        <td><input class="inp" data-di="${i}" data-c="0" dir="ltr" value="${esc(r[0])}" ${ro()}></td>
        <td><input class="inp" data-di="${i}" data-c="1" value="${esc(r[1])}" ${ro()}></td>
        <td><button class="btn small danger" data-del="${i}" ${ro()}>✕</button></td>`;
      tb.appendChild(trEl);
    });
    el.querySelectorAll("[data-c]").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        if (!requireWrite()) return;
        rows[+inp.dataset.di][+inp.dataset.c] = inp.value;
        touchProject(); paintPreview();
      });
    });
    el.querySelectorAll("[data-del]").forEach(b=>{
      b.addEventListener("click", ()=>{
        if (!requireWrite()) return;
        rows.splice(+b.dataset.del, 1); touchProject(); paintDict();
      });
    });
    el.querySelector("#cod-addrow").addEventListener("click", ()=>{
      if (!requireWrite()) return;
      rows.push(["", ""]); touchProject(); paintDict();
    });
  }
  root.querySelectorAll("[data-dt]").forEach(b=>{
    b.addEventListener("click", ()=>{ COD_DICT_TAB = b.dataset.dt; go("cod"); });
  });
  paintSlots(); paintPreview(); paintDict();
}

      box.classList.toggle("open", it.checked);

      rowsEl.innerHTML = "";
      it.rows.forEach((r, i)=>{
        const trEl = document.createElement("tr");

          <td><input type="radio" name="lr-${key}" data-sel="${i}"></td>

          <td></td>`;

      });
      rowsEl.querySelectorAll("[data-c]").forEach(inp=>{
        inp.addEventListener("change", ()=>{
          if (!requireWrite()) return;
          it.rows[+inp.dataset.ri][+inp.dataset.c] = inp.value;
          touchProject();
        });
      });
      rowsEl.querySelectorAll("[data-sel]").forEach(r=>{
        r.addEventListener("change", ()=>{ selRow = +r.dataset.sel; });
      });
    }
    paintRows();
    box.querySelector('[data-a="addrow"]').addEventListener("click", ()=>{
      if (!requireWrite()) return;
      it.rows.push(["", ""]); touchProject(); paintRows();
    });
    box.querySelector('[data-a="delrow"]').addEventListener("click", ()=>{
      if (!requireWrite()) return;
      if (selRow >= 0 && selRow < it.rows.length){
        it.rows.splice(selRow, 1); selRow = -1; touchProject(); paintRows();
      }
    });
    wrap.appendChild(box);
  }
}

        tb.appendChild(trEl);
      });
      tb.querySelectorAll("[data-c]").forEach(inp=>{
        inp.addEventListener("change", ()=>{
          if (!requireWrite()) return;
          rows[+inp.dataset.i][+inp.dataset.c] = inp.value;
          saveState();
        });
      });
      tb.querySelectorAll("[data-del]").forEach(b=>{
        b.addEventListener("click", ()=>{
          if (!requireWrite()) return;
          rows.splice(+b.dataset.del, 1); saveState(); paintRows();
        });
      });
    }
    paintRows();
    root.querySelector(`[data-sadd="${key}"]`).addEventListener("click", ()=>{
      if (!requireWrite()) return;
      rows.push([tr("sof.new_name"), "", ""]);
      saveState(); paintRows();
    });
  }
}

/* ==================== PAGE: ADM (admin panel) ==================== */
let ADM_LOG_USER = "";
function visibleUsers(){
  const list = STATE.users.filter(u=>isRoot() ? true : u.createdBy === USER.username);
  return list;
}
function renderAdm(root){
  const myLevel = USER.level;
  root.innerHTML = `
    <h1 class="h1">${esc(tr("adm.h1"))}</h1>
    <p class="page-hint">${esc(tr("adm.hint"))}</p>
    <div class="ro-note">${esc(isRoot() ? tr("adm.root_note") : tr("adm.scoped_note"))}</div>
    <div class="card">
      <div class="card-head"><span class="badge">ADM</span><h3>${esc(tr("adm.users"))}</h3>
        <div class="spacer"></div>
        <button class="btn small primary" id="adm-add" ${ro()}>＋ ${esc(tr("adm.add"))}</button>
      </div>
      <div class="tblwrap"><table class="tbl" id="adm-users">
        <thead><tr>
          <th>${esc(tr("col.user"))}</th>
          <th style="width:130px">${esc(tr("col.level"))}</th>
          <th style="width:240px"></th>
        </tr></thead><tbody></tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-head"><span class="badge gray">ADM</span><h3>${esc(tr("adm.guest"))}</h3></div>
      <div class="calc-note">${esc(tr("adm.guest_hint"))}</div>
      <div class="fldrow" style="max-width:720px">
        <div style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="g-en" ${STATE.guest.enabled?"checked":""} ${ro()}>
          <span style="font-size:13px">${esc(tr("adm.guest_enable"))}</span>
        </div>
        <div><label class="fld">${esc(tr("adm.guest_pass"))}</label>
          <input class="inp" id="g-pass" value="${esc(STATE.guest.pass)}" ${ro()}></div>
        <div><label class="fld">${esc(tr("adm.guest_max"))}</label>
          <input class="inp" id="g-max" dir="ltr" value="${esc(STATE.guest.max)}" ${ro()}></div>
        <div><label class="fld">${esc(tr("adm.guest_minutes"))}</label>
          <input class="inp" id="g-min" dir="ltr" value="${esc(STATE.guest.minutes)}" ${ro()}></div>
        <div><label class="fld">${esc(tr("adm.guest_used"))}</label>
          <div class="flexrow">
            <input class="inp" id="g-used" dir="ltr" value="${esc(STATE.guest.used)}" ${ro()}>
            <button class="btn small" id="g-reset" ${ro()}>${esc(tr("adm.guest_reset"))}</button>
          </div>
        </div>
      </div>
      <div class="calc-note" id="g-state"></div>
      <button class="btn primary" id="g-save" ${ro()}>✓ ${esc(tr("adm.guest_save"))}</button>
    </div>
    <div class="card">
      <div class="card-head"><span class="badge gray">LOG</span><h3>${esc(tr("adm.activity"))}</h3>
        <div class="spacer"></div>
        <select class="inp" id="log-user" style="width:170px">
          <option value="">${esc(tr("adm.log_all"))}</option>
          ${STATE.users.map(u=>`<option ${ADM_LOG_USER===u.username?"selected":""}>${esc(u.username)}</option>`).join("")}
        </select>
        <button class="btn small" id="log-csv">${esc(tr("adm.log_csv"))}</button>
        <button class="btn small danger" id="log-clear" ${ro()}>${esc(tr("adm.log_clear"))}</button>
      </div>
      <div class="tblwrap" style="max-height:300px"><table class="tbl" id="log-tbl">
        <thead><tr>
          <th style="width:150px">${esc(tr("adm.log_time"))}</th>
          <th style="width:120px">${esc(tr("adm.log_user")).replace(":", "")}</th>
          <th style="width:170px">${esc(tr("adm.log_action"))}</th>
          <th>${esc(tr("adm.log_details"))}</th>
        </tr></thead><tbody></tbody>
      </table></div>
    </div>`;
  const tb = root.querySelector("#adm-users tbody");
  function paintUsers(){
    tb.innerHTML = "";
    const users = visibleUsers();
    for (const u of users){
      const trEl = document.createElement("tr");
      trEl.innerHTML = `
        <td><b>${esc(u.username)}</b>${u.username===USER.username?`<span style="color:var(--hint);font-size:11.5px">${esc(tr("adm.you_mark"))}</span>`:""}
          ${u.isRoot?'<span class="badge gray" style="font-size:9.5px;margin-inline-start:6px">ROOT</span>':""}</td>
        <td><span class="badge ${u.level===1?"":"gray"}">${u.level} — ${esc(tr("lvl."+u.level))}</span></td>
        <td style="white-space:nowrap">
          <button class="btn small" data-a="pass" data-u="${esc(u.username)}" ${ro()}>${esc(tr("adm.reset_pass"))}</button>
          <select class="inp" style="width:150px;display:inline-block;padding:4px 8px" data-lvl-u="${esc(u.username)}" ${ro()}>
            ${[1,2,3,4,5].map(l=>`<option value="${l}" ${u.level===l?"selected":""}>${esc(tr("adm.set_level"))} ${l}</option>`).join("")}
          </select>
          <button class="btn small danger" data-a="del" data-u="${esc(u.username)}" ${ro()}>✕</button>
        </td>`;
      tb.appendChild(trEl);
    }
    tb.querySelectorAll('[data-a="pass"]').forEach(b=>{
      b.addEventListener("click", async ()=>{
        if (!requireWrite()) return;
        const uname = b.dataset.u;
        const p = prompt(tr("adm.new_pass"), "");
        if (p && p.trim()){
          const u = STATE.users.find(x=>x.username === uname);
          if (u){ u.pass = await hashAsync(p.trim()); saveState(); toast(tr("msg.saved")); }
        }
      });
    });
    tb.querySelectorAll("[data-lvl-u]").forEach(sel=>{
      sel.addEventListener("change", async ()=>{
        if (!requireWrite()) return;
        const u = STATE.users.find(x=>x.username === sel.dataset.lvlU);
        if (!u) return;
        const nl = parseInt(sel.value);
        if (u.level === 1 && nl !== 1){
          const admins = visibleUsers().filter(x=>x.level === 1);
          if (admins.length <= 1){ toast(tr("adm.err_last_admin")); renderAdm(root); return; }
        }
        u.level = nl;
        if (nl === 1 && !u.createdBy) u.createdBy = USER.username;
        saveState(); toast(tr("msg.saved")); paintUsers();
      });
    });
    tb.querySelectorAll('[data-a="del"]').forEach(b=>{
      b.addEventListener("click", ()=>{
        if (!requireWrite()) return;
        const uname = b.dataset.u;
        if (uname === USER.username){ toast(tr("adm.self_delete")); return; }
        const u = STATE.users.find(x=>x.username === uname);
        if (u && u.isRoot){ toast(tr("adm.err_root") || tr("adm.err_last_admin")); return; }
        if (u && u.level === 1 && visibleUsers().filter(x=>x.level===1).length <= 1){
          toast(tr("adm.err_last_admin")); return;
        }
        confirmBox(trf("adm.confirm_del", uname), ()=>{
          STATE.users = STATE.users.filter(x=>x.username !== uname);
          saveState(); paintUsers();
        });
      });
    });
  }
  paintUsers();
  root.querySelector("#adm-add").addEventListener("click", ()=>{
    if (!requireWrite()) return;
    const uname = prompt(tr("adm.username"), "");
    if (!uname || !uname.trim()) return;
    if (STATE.users.some(u=>u.username === uname.trim())){ toast(tr("adm.err_exists")); return; }
    const pass = prompt(tr("adm.password"), "");
    if (!pass) return;
    const level = parseInt(prompt(tr("adm.level") + " (1-5):", "3") || "3") || 3;
    hashAsync(pass.trim()).then(h=>{
      STATE.users.push({username:uname.trim(), pass:h, level, isRoot:0, createdBy:USER.username});
      saveState(); paintUsers(); toast(tr("msg.saved"));
    });
  });
  /* guest settings */
  const gState = root.querySelector("#g-state");
  gState.textContent = trf("adm.guest_state", STATE.guest.used, STATE.guest.max);
  root.querySelector("#g-reset").addEventListener("click", ()=>{
    if (!requireWrite()) return;
    STATE.guest.used = 0; saveState();
    root.querySelector("#g-used").value = 0;
    gState.textContent = trf("adm.guest_state", 0, STATE.guest.max);
    toast(tr("msg.saved"));
  });
  root.querySelector("#g-save").addEventListener("click", ()=>{
    if (!requireWrite()) return;
    STATE.guest.enabled = root.querySelector("#g-en").checked;
    STATE.guest.pass = root.querySelector("#g-pass").value;
    STATE.guest.max = parseNum(root.querySelector("#g-max").value) || 3;
    STATE.guest.minutes = parseNum(root.querySelector("#g-min").value) || 30;
    STATE.guest.used = parseNum(root.querySelector("#g-used").value) || 0;
    saveState(); toast(tr("msg.saved"));
    gState.textContent = trf("adm.guest_state", STATE.guest.used, STATE.guest.max);
  });
  /* activity log */
  const logTb = root.querySelector("#log-tbl tbody");
  function paintLog(){
    logTb.innerHTML = "";
    const rows = STATE.activity.filter(a=>!ADM_LOG_USER || a.user === ADM_LOG_USER).slice(-300).reverse();
    if (!rows.length){
      logTb.innerHTML = `<tr><td colspan="4" class="empty-note">—</td></tr>`;
      return;
    }
    for (const a of rows){
      const trEl = document.createElement("tr");
      trEl.innerHTML = `
        <td style="direction:ltr;text-align:start">${esc(a.ts.replace("T"," ").slice(0,19))}</td>
        <td>${esc(a.user)}</td>
        <td>${esc(actName(a.action))}</td>
        <td>${esc(a.details)}</td>`;
      logTb.appendChild(trEl);
    }
  }
  paintLog();
  root.querySelector("#log-user").addEventListener("change", e=>{ ADM_LOG_USER = e.target.value; paintLog(); });
  root.querySelector("#log-csv").addEventListener("click", ()=>{
    const rows = STATE.activity.filter(a=>!ADM_LOG_USER || a.user === ADM_LOG_USER);
    if (!rows.length){ toast(tr("csv.empty")); return; }
    downloadCSV("faravariyar_activity.csv",
      [[tr("adm.log_time"), tr("adm.log_user"), tr("adm.log_action"), tr("adm.log_details")],
       ...rows.map(a=>[a.ts.replace("T"," ").slice(0,19), a.user, actName(a.action), a.details])]);
  });
  root.querySelector("#log-clear").addEventListener("click", ()=>{
    if (!requireWrite()) return;
    confirmBox(tr("adm.log_clear"), ()=>{ STATE.activity = []; saveState(); paintLog(); });
  });
}

<script>
/* ==================== BOOT ==================== */

/* ---------- login screen ---------- */
function refreshLoginTexts(){
  document.getElementById("lg-title").textContent = tr("login.title");
  document.getElementById("lg-sub").textContent = tr("login.subtitle");
  document.getElementById("lg-user-l").textContent = tr("login.user");
  document.getElementById("lg-pass-l").textContent = tr("login.pass");
  document.getElementById("lg-btn").textContent = tr("login.btn");
  document.getElementById("lg-foot").textContent = tr("login.seed_note");
  document.getElementById("login-lang-btn").textContent = tr("btn.lang");
  document.getElementById("lg-user").placeholder = tr("login.user");
  document.getElementById("lg-pass").placeholder = tr("login.pass");
  document.getElementById("hd-palette").title = tr("pal.colors");
  document.getElementById("hd-whatsnew").title = tr("whn.title");
  document.getElementById("side-title").textContent = tr("app.name");
}
function showLogin(){
  document.getElementById("app").classList.remove("on");
  document.getElementById("login-screen").style.display = "flex";
  refreshLoginTexts();
  document.getElementById("lg-err").textContent = "";
  document.getElementById("lg-user").value = "";
  document.getElementById("lg-pass").value = "";
  setTimeout(()=>document.getElementById("lg-user").focus(), 60);
}
async function tryLogin(username, password){
  const err = document.getElementById("lg-err");
  const uname = (username || "").trim();
  if (!uname){ err.textContent = tr("login.err"); return; }
  /* guest mode */
  if (STATE.guest.enabled && uname.toLowerCase() === "guest"){
    const gp = STATE.guest.pass || "";
    if ((await hashAsync(password)) !== gp && password !== gp){
      err.textContent = tr("login.err"); return;
    }
    if (STATE.guest.used >= STATE.guest.max){
      err.textContent = tr("login.err_guest_limit"); return;
    }
    STATE.guest.used++;
    saveState();
    USER = {username:"guest", level:5, isRoot:0};
    logAction("login");
    startGuestTimer();
    enterApp();
    return;
  }
  const u = STATE.users.find(x=>x.username === uname);
  const ok = u && await verifyPassword(u, password);
  if (!ok){
    logAction("login.failed", uname);
    err.textContent = tr("login.err");
    return;
  }
  USER = {username:u.username, level:u.level, isRoot:u.isRoot};
  logAction("login");
  saveSession();
  enterApp();
}
function startGuestTimer(){
  clearTimeout(guestTimer);
  const minutes = parseNum(STATE.guest.minutes) || 30;
  guestTimer = setTimeout(()=>{
    logAction("guest.expired");
    USER = null; clearSession();
    showLogin();
    toast(tr("msg.guest_expired"));
  }, minutes * 60 * 1000);
}

/* ---------- enter the app ---------- */
function enterApp(){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").classList.add("on");
  myPrefs();
  setLang(LANG);
  applyTheme();
  /* first project (desktop seeds one on first run) */
  if (!STATE.projects.length && isWritable()){
    createProject(trn("prj.default_name", 1));
    logAction("project.new");
  }
  if (!STATE.currentProject && STATE.projects.length)
    STATE.currentProject = STATE.projects[0].uid;
  CURRENT_PAGE = "info";
  rerenderAll();
  if (!currentProject()){
    go("noprj");
  }
}

/* ---------- noprj page ---------- */
PAGES.noprj = root=>{
  root.innerHTML = `
    <h1 class="h1">${esc(tr("noprj.h1"))}</h1>
    <p class="page-hint">${esc(tr("noprj.hint"))}</p>
    <div class="card" style="max-width:480px;margin-inline:auto;text-align:center;padding:40px">
      <div style="font-size:52px">🗂</div>
      <div style="margin-top:14px;color:var(--hint);font-size:13px;line-height:2">${esc(tr("noprj.hint"))}</div>
    </div>`;
};

/* ---------- JSON backup / restore ---------- */
function backupJson(){
  saveStateNow();
  downloadFile("faravariyar_backup_" + new Date().toISOString().slice(0,10) + ".json",
    JSON.stringify(STATE, null, 2), "application/json");
}
function restoreJson(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const st = JSON.parse(reader.result);
      if (!st || !Array.isArray(st.users)) throw new Error("bad file");
      const d = defaultState();
      for (const k of Object.keys(d)) if (st[k] === undefined) st[k] = d[k];
      STATE = st;
      saveStateNow();
      USER = null; clearSession();
      showLogin();
      toast(tr("msg.saved"));
    }catch(e){
      toast("Restore error: " + e.message);
    }
  };
  reader.readAsText(file);
}

/* ---------- init ---------- */
function init(){
  STATE = loadState();
  /* pre-login look */
  try{
    LANG = localStorage.getItem("fy_login_lang") === "fa" ? "fa" : "en";
  }catch(e){ LANG = "en"; }
  UI = {dark:false, accent:"teal", font:"vazir", size:10};
  setLang(LANG);
  applyTheme();
  wireHeader();
  /* login events */
  document.getElementById("lg-btn").addEventListener("click", ()=>
    tryLogin(document.getElementById("lg-user").value, document.getElementById("lg-pass").value));
  document.getElementById("lg-pass").addEventListener("keydown", e=>{
    if (e.key === "Enter") tryLogin(document.getElementById("lg-user").value, document.getElementById("lg-pass").value);
  });
  document.getElementById("lg-user").addEventListener("keydown", e=>{
    if (e.key === "Enter") document.getElementById("lg-pass").focus();
  });
  document.getElementById("login-lang-btn").addEventListener("click", ()=>{
    LANG = LANG === "fa" ? "en" : "fa";
    try{ localStorage.setItem("fy_login_lang", LANG); }catch(e){}
    setLang(LANG); refreshLoginTexts();
  });
  /* session restore */
  try{
    const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    if (sess && sess.u){
      const u = STATE.users.find(x=>x.username === sess.u);
      if (u){
        USER = {username:u.username, level:u.level, isRoot:u.isRoot};
        enterApp();
      }
    }
  }catch(e){}
  if (!USER || !document.getElementById("app").classList.contains("on")) showLogin();
}
init();
</script>
