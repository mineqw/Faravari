<style>
/* ============ FaravariYar Web — styles (mirrors app/theme.py tokens) ============ */
:root{
  --bg:#eef2f7; --header-bg:#ffffff; --header-border:#e2e8f0;
  --text:#0f172a; --text2:#475569; --hint:#64748b;
  --sidebar-bg:#0f172a; --sidebar-text:#cbd5e1; --sidebar-hover:#1e293b;
  --side-active:#0d9488; --side-active-t:#ffffff;
  --card-bg:#ffffff; --card-border:#e2e8f0;
  --btn-bg:#ffffff; --btn-border:#cbd5e1; --btn-text:#0f172a;
  --btn-hover:#f1f5f9; --btn-hover-b:#94a3b8; --btn-pressed:#e2e8f0;
  --btn-dis-t:#94a3b8; --btn-dis-bg:#f1f5f9;
  --accent:#0d9488; --accent-hov:#0f766e; --accent-prg:#115e59; --accent-text:#ffffff;
  --danger-bg:#fef2f2; --danger-border:#fecaca; --danger-text:#b91c1c; --danger-hov:#fee2e2;
  --input-bg:#ffffff; --input-border:#cbd5e1; --input-text:#0f172a; --input-focus:#0d9488;
  --sel-bg:#ccfbf1; --sel-text:#0f172a;
  --head-bg:#f8fafc; --head-text:#475569;
  --gridline:#f1f5f9;
  --badge-bg:#0d9488; --badge-text:#ffffff;
  --gbadge-bg:#1e293b; --gbadge-text:#e2e8f0;
  --out-val:#0f766e; --err:#b91c1c;
  --scroll:#cbd5e1; --line:#e2e8f0;
  --canvas-bg:#e8edf4; --canvas-dot:#c9d4e2;
  --node-bg:#ffffff; --node-border:#94a3b8; --node-sel:#0d9488;
  --stream:#0f766e; --stream-sel:#b45309; --port:#0d9488;
  --radius:12px; --radius-sm:9px;
  --font-fa:'Vazirmatn','B Nazanin',Tahoma,sans-serif;
  --font-latin:'Times New Roman',Vazirmatn,Tahoma,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:var(--font-fa); background:var(--bg); color:var(--text);
  font-size:14px; overflow:hidden;
}
body[dir="ltr"]{font-family:var(--font-latin)}
html[lang="fa"] body[dir="ltr"] .latinfirst{font-family:var(--font-latin)}
button{font-family:inherit}
input,select,textarea{font-family:inherit; color:var(--input-text)}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll); border-radius:6px}
::-webkit-scrollbar-thumb:hover{filter:brightness(.92)}

/* ---------- generic controls ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--btn-bg); color:var(--btn-text);
  border:1px solid var(--btn-border); border-radius:var(--radius-sm);
  padding:7px 13px; font-size:13.5px; cursor:pointer; white-space:nowrap;
  transition:background .12s,border-color .12s;
  user-select:none;
}
.btn:hover{background:var(--btn-hover); border-color:var(--btn-hover-b)}
.btn:active{background:var(--btn-pressed)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-text); font-weight:700}
.btn.primary:hover{background:var(--accent-hov); border-color:var(--accent-hov)}
.btn.danger{background:var(--danger-bg); border-color:var(--danger-border); color:var(--danger-text)}
.btn.danger:hover{background:var(--danger-hov)}
.btn.small{padding:4px 9px; font-size:12.5px; border-radius:8px}
.btn.icon{padding:7px 9px}
.btn:disabled{color:var(--btn-dis-t); background:var(--btn-dis-bg); border-color:var(--line); cursor:not-allowed}
.inp, select.inp, textarea.inp{
  background:var(--input-bg); border:1px solid var(--input-border);
  border-radius:var(--radius-sm); padding:7px 10px; font-size:13.5px;
  width:100%; outline:none; transition:border-color .12s, box-shadow .12s;
}
.inp:focus{border-color:var(--input-focus); box-shadow:0 0 0 2px color-mix(in srgb, var(--input-focus) 22%, transparent)}
textarea.inp{resize:vertical; min-height:90px; line-height:1.8}
label.fld{display:block; font-size:12.5px; color:var(--text2); margin:0 0 4px}
.fldrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px 14px}

/* ---------- badges & cards ---------- */
.badge{
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--badge-bg); color:var(--badge-text);
  border-radius:8px; font-size:11.5px; font-weight:700; padding:3px 8px;
  letter-spacing:.5px; direction:ltr;
}
.badge.gray{background:var(--gbadge-bg); color:var(--gbadge-text)}
.card{
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;
}
.card-head{
  display:flex; align-items:center; gap:10px; margin:-4px 0 14px;
}
.card-head h3{font-size:15.5px; font-weight:700}
.card-head .spacer{flex:1}
.h1{font-size:21px; font-weight:800; text-align:center; margin:6px 0 4px}
.page-hint{color:var(--hint); font-size:12.8px; text-align:center; margin:0 auto 16px; max-width:860px; line-height:1.9}
.page{padding:18px 22px 40px; overflow-y:auto; height:calc(100vh - 58px)}

/* ---------- login ---------- */
#login-screen{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg); z-index:60; flex-direction:column; gap:14px;
}
.login-box{
  width:400px; max-width:92vw; background:var(--card-bg);
  border:1px solid var(--card-border); border-radius:16px;
  padding:26px 28px; box-shadow:0 12px 40px rgba(2,8,23,.10);
}
.login-logo{text-align:center; font-size:40px; line-height:1}
.login-box h1{text-align:center; font-size:19px; margin:8px 0 2px}
.login-box .sub{text-align:center; color:var(--hint); font-size:12.5px; margin-bottom:16px}
.login-box .fld{margin-top:10px}
.login-box .btn{width:100%; justify-content:center; margin-top:16px; padding:10px}
.login-err{color:var(--err); font-size:12.5px; text-align:center; min-height:18px; margin-top:8px}
.login-foot{color:var(--hint); font-size:11.5px; text-align:center; margin-top:12px; line-height:1.9}
.login-top{position:absolute; top:14px; inset-inline-end:14px; display:flex; gap:8px}

/* ---------- app shell ---------- */
#app{display:none}
#app.on{display:block}
.header{
  height:58px; background:var(--header-bg); border-bottom:1px solid var(--header-border);
  display:flex; align-items:center; gap:8px; padding:0 14px; position:relative; z-index:30;
}
.header .brand{display:flex; flex-direction:column; margin-inline-start:4px; margin-inline-end:auto; min-width:0}
.header .brand b{font-size:16.5px; letter-spacing:.3px}
.header .brand span{font-size:11px; color:var(--hint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw}
.hgroup{display:flex; align-items:center; gap:8px}
.user-badge{
  background:var(--gbadge-bg); color:var(--gbadge-text); border-radius:9px;
  padding:7px 12px; font-size:12.5px; white-space:nowrap;
}
.user-badge b{color:var(--side-active)}
body.dark .user-badge b{color:#2dd4bf}

/* ---------- sidebar ---------- */
.sidebar{
  position:fixed; top:58px; bottom:0; inset-inline-start:0; width:58px;
  background:var(--sidebar-bg); color:var(--sidebar-text);
  transition:width .22s ease; overflow:hidden; z-index:25;
  display:flex; flex-direction:column;
}
.sidebar:hover,.sidebar.pinned{width:240px}
.side-title{
  text-align:center; font-weight:800; font-size:14.5px; color:#fff;
  height:46px; line-height:46px; white-space:nowrap; letter-spacing:.3px;
  opacity:0; transition:opacity .18s;
}
.sidebar:hover .side-title,.sidebar.pinned .side-title{opacity:1}
.side-nav{flex:1; overflow-y:auto; overflow-x:hidden; padding:6px 8px 10px}
.side-nav::-webkit-scrollbar{width:6px}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%;
  background:none; border:none; color:var(--sidebar-text);
  padding:10px 10px; margin:2px 0; border-radius:9px; cursor:pointer;
  font-size:13px; text-align:start; white-space:nowrap; position:relative;
}
.nav-item:hover{background:var(--sidebar-hover); color:var(--sidebar-text)}
.nav-item.active{background:var(--side-active); color:var(--side-active-t); font-weight:700}
.nav-item .ncode{
  direction:ltr; font-size:11px; font-weight:700; opacity:.92;
  min-width:34px; text-align:center; letter-spacing:.6px;
}
.nav-item.active .ncode{opacity:1}
.nav-item .nlabel{flex:1; overflow:hidden; text-overflow:ellipsis}
.nav-item .nico{font-size:15px; width:20px; text-align:center; flex:none}
.side-foot{
  padding:10px; font-size:10.5px; color:var(--sidebar-text); opacity:.75;
  display:flex; align-items:center; justify-content:center; gap:8px; direction:ltr;
  white-space:nowrap; overflow:hidden;
}
.pin-btn{
  position:absolute; top:8px; inset-inline-end:6px; background:none; border:none;
  color:var(--sidebar-text); cursor:pointer; font-size:14px; opacity:0; transition:opacity .15s;
  padding:4px;
}
.sidebar:hover .pin-btn,.sidebar.pinned .pin-btn{opacity:.85}
.sidebar.pinned .pin-btn{color:#2dd4bf}
.main{margin-inline-start:58px; transition:margin .22s ease}
body.side-open .main{margin-inline-start:240px}

/* ---------- tables ---------- */
.tblwrap{overflow:auto; border:1px solid var(--card-border); border-radius:var(--radius-sm)}
table.tbl{width:100%; border-collapse:collapse; font-size:13px; background:var(--card-bg)}
table.tbl th{
  background:var(--head-bg); color:var(--head-text); font-weight:700;
  padding:9px 10px; text-align:start; border-bottom:1px solid var(--card-border);
  white-space:nowrap; position:sticky; top:0;
}
table.tbl td{
  padding:8px 10px; border-bottom:1px solid var(--gridline); vertical-align:middle;
}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr.sel td{background:var(--sel-bg); color:var(--sel-text)}
table.tbl td .inp{padding:4px 8px; border-radius:7px; font-size:12.8px}
table.tbl td.ro{color:var(--out-val); font-weight:700}
table.tbl td.num{direction:ltr; text-align:center; font-variant-numeric:tabular-nums}
.empty-note{
  color:var(--hint); text-align:center; padding:26px 10px; font-size:13px;
  line-height:2; white-space:pre-line;
}

/* ---------- modal ---------- */
.modal-back{
  position:fixed; inset:0; background:rgba(2,8,23,.45); z-index:70;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:14px; width:520px; max-width:94vw; max-height:88vh;
  display:flex; flex-direction:column; box-shadow:0 18px 60px rgba(2,8,23,.30);
}
.modal.wide{width:1000px}
.modal-head{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px}
.modal-head .x{margin-inline-start:auto; background:none; border:none; font-size:17px; cursor:pointer; color:var(--hint); padding:4px 6px}
.modal-body{padding:14px 18px; overflow-y:auto; font-size:13.5px; line-height:2}
.modal-foot{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}

/* ---------- toast ---------- */
#toast{
  position:fixed; bottom:22px; inset-inline-start:50%; transform:translateX(50%);
  background:var(--gbadge-bg); color:var(--gbadge-text); padding:10px 20px;
  border-radius:10px; font-size:13px; z-index:90; opacity:0; pointer-events:none;
  transition:opacity .25s; box-shadow:0 8px 24px rgba(2,8,23,.25);
}
#toast.show{opacity:1}

/* ---------- context menu ---------- */
.ctxmenu{
  position:fixed; z-index:80; background:var(--menu-bg,var(--card-bg));
  border:1px solid var(--menu-border,var(--card-border)); border-radius:10px;
  box-shadow:0 10px 30px rgba(2,8,23,.22); padding:6px; min-width:180px;
}
.ctxmenu button{
  display:flex; width:100%; align-items:center; gap:8px; background:none; border:none;
  padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13px; color:var(--text);
  text-align:start;
}
.ctxmenu button:hover{background:var(--sel-bg); color:var(--sel-text)}
.ctxmenu .swatch{width:14px; height:14px; border-radius:4px; flex:none}
.ctxmenu .sep{height:1px; background:var(--line); margin:5px 4px}

/* ---------- canvas ---------- */
.canvas-card{padding:0; overflow:hidden}
.canvas-toolbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 12px; border-bottom:1px solid var(--line);
}
.canvas-toolbar .feedbox{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text2)}
.canvas-toolbar .feedbox input{width:110px; padding:5px 8px}
.canvas-toolbar .grow{flex:1}
.cv-outer{
  position:relative; height:560px; background:var(--canvas-bg); overflow:hidden;
  background-image:radial-gradient(var(--canvas-dot) 1.1px, transparent 1.1px);
  background-size:22px 22px; cursor:default; touch-action:none;
}
.cv-outer.tall{height:calc(100vh - 300px); min-height:430px}
.cv-viewport{position:absolute; inset:0; transform-origin:0 0}
.cv-outer.linking{cursor:crosshair}
.cv-outer.panning{cursor:grabbing}
.cnode{
  position:absolute; min-width:130px; max-width:190px;
  background:var(--node-bg); border:1.6px solid var(--node-border);
  border-radius:9px; padding:7px 10px 8px; cursor:grab; user-select:none;
  box-shadow:0 3px 10px rgba(2,8,23,.10); font-size:12px; line-height:1.5;
}
.cnode.sel{border-color:var(--node-sel); box-shadow:0 0 0 3px color-mix(in srgb,var(--node-sel) 26%, transparent)}
.cnode .tag{font-weight:800; font-size:12px; direction:ltr; text-align:start}
.cnode .nname{color:var(--text2); font-size:11.3px; margin-top:2px}
.cnode .nico{position:absolute; top:-11px; inset-inline-start:9px; background:var(--node-sel);
  color:var(--side-active-t); border-radius:7px; width:22px; height:22px; font-size:12px;
  display:flex; align-items:center; justify-content:center}
.cnode .chandle{
  position:absolute; width:12px; height:12px; border-radius:50%;
  background:var(--port); opacity:0; transition:opacity .12s; cursor:crosshair;
}
.cnode .chandle.t{top:-7px; left:calc(50% - 6px)}
.cnode .chandle.b{bottom:-7px; left:calc(50% - 6px)}
.cnode .chandle.l{left:-7px; top:calc(50% - 6px)}
.cnode .chandle.r{right:-7px; top:calc(50% - 6px)}
.cnode:hover .chandle{opacity:.95}
.cvsvg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
.cvsvg path.stream{pointer-events:stroke; cursor:pointer; fill:none; stroke-width:2.2}
.cvsvg path.stream.sel{stroke:var(--stream-sel) !important; stroke-width:3.2}
.cvsvg text.snum{font-size:10.5px; font-weight:700; paint-order:stroke; pointer-events:none}
.cvsvg circle.snumc{pointer-events:none}
.cv-stats{padding:8px 14px; font-size:12.3px; color:var(--hint); border-top:1px solid var(--line); display:flex; gap:14px; flex-wrap:wrap}
.cv-zoom{
  position:absolute; bottom:12px; inset-inline-start:12px; display:flex; gap:6px; z-index:5;
}
.cv-zoom .btn{padding:5px 9px; font-size:13px}
.cv-pagebadge{position:absolute; bottom:12px; inset-inline-end:12px; background:var(--gbadge-bg); color:var(--gbadge-text);
  border-radius:8px; padding:5px 10px; font-size:12px; z-index:5}

/* toolbox */
.toolbox{max-height:640px; overflow-y:auto; padding-inline-end:4px}
.tb-family{margin-bottom:8px; border:1px solid var(--card-border); border-radius:9px; overflow:hidden}
.tb-family > .tb-fhead{
  display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px;
  background:var(--head-bg); color:var(--head-text); border:none; cursor:pointer;
  font-size:12.8px; font-weight:700; text-align:start;
}
.tb-family .tb-items{display:none; padding:6px}
.tb-family.open .tb-items{display:block}
.tb-item{
  display:flex; align-items:center; gap:8px; width:100%; padding:7px 8px; border:none;
  background:none; border-radius:7px; cursor:pointer; font-size:12.8px; color:var(--text); text-align:start;
}
.tb-item:hover{background:var(--sel-bg); color:var(--sel-text)}
.tb-item .code{direction:ltr; font-size:10.8px; color:var(--hint); font-weight:700; margin-inline-start:auto}
.tb-add{width:100%; justify-content:center; margin-top:8px}

/* calculators */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px}
.tile{
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:transform .12s, box-shadow .12s, border-color .12s;
}
.tile:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:0 8px 22px rgba(2,8,23,.10)}
.tile .tbadge{margin-bottom:10px}
.tile b{font-size:14.5px}
.tile .outs{color:var(--hint); font-size:11.8px; margin-top:8px; line-height:1.8}
.calc-out{
  background:var(--head-bg); border:1px dashed var(--card-border); border-radius:9px;
  padding:10px 14px; margin-top:14px; font-size:13.5px;
}
.calc-out .orow{display:flex; justify-content:space-between; gap:10px; padding:3px 0}
.calc-out .orow b{color:var(--out-val); direction:ltr}
.calc-note{color:var(--hint); font-size:11.8px; margin-top:8px; line-height:1.8}

/* lab sections */
.lab-item{border:1px solid var(--card-border); border-radius:10px; margin-bottom:10px; overflow:hidden}
.lab-item > .lab-head{
  display:flex; align-items:center; gap:10px; width:100%; padding:11px 14px;
  background:none; border:none; cursor:pointer; font-size:13.5px; color:var(--text); text-align:start;
}
.lab-item > .lab-head:hover{background:var(--btn-hover)}
.lab-item .chev{margin-inline-start:auto; transition:transform .15s; color:var(--hint)}
.lab-item.open .chev{transform:rotate(180deg)}
.lab-form{display:none; padding:4px 14px 14px; border-top:1px solid var(--gridline)}
.lab-item.open .lab-form{display:block}

/* coding slots */
.slots{display:flex; align-items:center; gap:6px; flex-wrap:wrap; direction:ltr}
.slot{
  min-width:86px; height:44px; border:2px dashed var(--btn-border); border-radius:9px;
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700;
  color:var(--text2); cursor:pointer; background:var(--input-bg);
}
.slot.filled{border-style:solid; border-color:var(--accent); color:var(--accent); background:var(--sel-bg)}
.slotsep{font-size:16px; font-weight:800; color:var(--hint)}
.cod-preview{
  direction:ltr; text-align:center; font-size:20px; font-weight:800; letter-spacing:2px;
  background:var(--head-bg); border-radius:9px; padding:12px; color:var(--out-val);
}

/* misc grids */
.mini-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px}
.comp-card{
  display:flex; align-items:center; gap:12px; background:var(--card-bg);
  border:1px solid var(--card-border); border-radius:10px; padding:12px 14px; font-size:13.5px;
}
.comp-card .logo{width:38px; height:38px; border-radius:9px; background:var(--sel-bg); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:17px; flex:none}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px}
.kv .k{color:var(--hint); white-space:nowrap}
.ro-note{background:var(--danger-bg); color:var(--danger-text); border:1px solid var(--danger-border);
  border-radius:9px; padding:8px 12px; font-size:12.5px; margin-bottom:12px}
.whn-item{border-bottom:1px solid var(--gridline); padding:10px 4px}
.whn-item:last-child{border-bottom:none}
.whn-item b{color:var(--accent); direction:ltr; display:inline-block}
.searchbar{max-width:340px}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}
@media (max-width:1000px){.two-col{grid-template-columns:1fr}}
.linklike{background:none; border:none; color:var(--accent); cursor:pointer; font-size:12.5px; text-decoration:underline; padding:2px}
.dangerlink{color:var(--danger-text)}
.flexrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.mono{direction:ltr; font-family:ui-monospace,Consolas,monospace}
@media print{.header,.sidebar,.canvas-toolbar,.cv-zoom{display:none !important} .main{margin:0} .page{height:auto; overflow:visible}}
</style>

const STR = {

<script>
/* ==================== CORE ==================== */

/* ---------- i18n ---------- */
let LANG = "en";
function tr(key){
  const item = STR[key];
  if (!item) return key;
  return LANG === "en" ? item[1] : item[0];
}
function trf(key, ...args){
  let s = tr(key);
  for (const a of args) s = s.replace("%s", a);
  return s;
}
function trn(key, n){ // numeric %d/%s
  let s = tr(key);
  return s.replace("%d", n).replace("%s", n);
}
function cname(item){ // catalog item name
  return LANG === "en" ? item.en : item.fa;
}
function setLang(lang){
  LANG = (lang === "fa") ? "fa" : "en";
  document.documentElement.lang = LANG;
  document.body.dir = (LANG === "fa") ? "rtl" : "ltr";
  document.body.classList.toggle("dark", STATE.dark);
}

/* ---------- persistent state (localStorage) ---------- */
const LS_KEY = "faravariyar_web_v1";
const SESSION_KEY = "faravariyar_web_session";
let STATE = null;

function defaultState(){
  return {
    users: [
      {username:"admin", pass:hashSync("admin"), level:1, isRoot:1, createdBy:""},
      {username:"user",  pass:hashSync("1"),     level:3, isRoot:0, createdBy:"admin"},
    ],
    guest: {enabled:false, pass:"", max:3, used:0, minutes:30},
    prefs: {},               // per-user look: {lang,dark,accent,font,size}
    activity: [],
    projects: [],
    currentProject: null,
    sof: {},                 // global software lists
    lib: DEFAULT_LIB.map(r=>r.slice()),
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (raw){
      const st = JSON.parse(raw);
      // minimal migration guarantees
      const d = defaultState();
      for (const k of Object.keys(d)) if (st[k] === undefined) st[k] = d[k];
      return st;
    }
  }catch(e){ console.error("state load failed", e); }

/* ---------- password hash (SHA-256 via crypto.subtle, pure-JS fallback) ---------- */
function hashSync(text){
  /* small deterministic fallback used for seeding; real logins use hashAsync */
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  const s = "fy::" + text;
  for (let i=0;i<s.length;i++){
    h1 = (h1 ^ s.charCodeAt(i)) >>> 0; h1 = (h1 * 16777619) >>> 0;
    h2 = (h2 + s.charCodeAt(i) * (i+7)) >>> 0; h2 = (h2 * 31 + 0x9e3779b9) >>> 0;
  }
  return "fnv:" + h1.toString(16) + h2.toString(16);
}
async function hashAsync(text){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("fy::" + text));
    return "sha:" + Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return hashSync(text); }
}
/* upgrade seeded FNV hashes to SHA-256 lazily at login time */
async function verifyPassword(user, pass){
  if (user.pass.startsWith("fnv:")){
    const good = user.pass === hashSync(pass);
    if (good){ user.pass = await hashAsync(pass); saveState(); }
    return good;
  }
  return user.pass === (await hashAsync(pass));
}

/* ---------- number utils (mirrors calcs.parse_number) ---------- */
const DIGIT_MAP = {"۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9",
  "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
  "٫":".", "٬":"", "،":""};
function parseNum(text){
  if (text === null || text === undefined) return null;
  let s = String(text).trim();
  if (!s) return null;
  s = s.replace(/[۰-۹٠-٩٫٬،]/g, ch => DIGIT_MAP[ch] ?? ch);
  s = s.replace(/,/g, "");
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}
function fmtN(v, digits=2){
  if (v === null || v === undefined || isNaN(v)) return "—";
  const r = Math.round(v * 10**digits) / 10**digits;
  return String(r);
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let toastTimer = null;

  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);

function modal(title, bodyHTML, buttons=[], opts={}){
  const back = document.createElement("div");
  back.className = "modal-back";
  const wide = opts.wide ? " wide" : "";
  back.innerHTML = `
    <div class="modal${wide}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="x">✕</button></div>
      <div class="modal-body">${bodyHTML}</div>
      <div class="modal-foot"></div>
    </div>`;
  const foot = back.querySelector(".modal-foot");
  for (const b of buttons){
    const btn = document.createElement("button");
    btn.className = "btn" + (b.kind ? " " + b.kind : "");
    btn.textContent = b.label;
    btn.addEventListener("click", ()=>{ if (b.onClick) b.onClick(back); if (b.keep!==true) back.remove(); });
    foot.appendChild(btn);
  }
  if (!buttons.length) foot.style.display = "none";
  back.querySelector(".x").addEventListener("click", ()=>{ back.remove(); if (opts.onClose) opts.onClose(); });
  back.addEventListener("mousedown", e=>{ if (e.target === back){ back.remove(); if (opts.onClose) opts.onClose(); } });
  document.getElementById("modal-root").appendChild(back);
  return back;
}

function ctxMenu(x, y, items){

    if (it === "-"){ const s=document.createElement("div"); s.className="sep"; m.appendChild(s); continue; }

    const lbl = document.createElement("span"); lbl.textContent = it.label; b.appendChild(lbl);
    b.addEventListener("click", ()=>{ closeCtx(); it.onClick(); });

  m.style.left = Math.min(x, window.innerWidth - r.width - 8) + "px";
  m.style.top = Math.min(y, window.innerHeight - r.height - 8) + "px";

}

/* ---------- downloads (CSV / JSON / PNG) ---------- */
function downloadFile(name, content, mime){
  const blob = new Blob(["\ufeff" + content], {type: mime || "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast(trf("csv.saved", name));
}
function csvCell(v){
  v = String(v ?? "");
  if (/[",;\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function downloadCSV(name, rows){
  downloadFile(name, rows.map(r=>r.map(csvCell).join(",")).join("\r\n"), "text/csv;charset=utf-8");
}

<script>
/* ==================== MASS-BALANCE ENGINE (port of app/modules/balance.py) ==================== */

function infoNum(d, key){
  for (const sec of Object.keys(d.info)){
    const v = d.info[sec][key];
    if (v !== undefined){ const n = parseNum(v); return n; }
  }
  return null;
}
function bal_feed_tonnage(d){
  const v = parseNum(d.crd.feed);
  return (v !== null && v > 0) ? v : null;
}
function isWaterStream(s){ return WATER_TYPES.includes(s.stype || ""); }

function bal_plant_rates(d){
  const cap = infoNum(d, "capacity"), days = infoNum(d, "days");
  if (cap === null || cap <= 0 || days === null || days <= 0) return null;
  const holiday = infoNum(d, "holiday") || 0;
  const annualDays = days * 52 - holiday;
  if (annualDays <= 0) return null;
  const rate = (shifts, hours)=>{
    const sh = parseNum(shifts), hr = parseNum(hours);
    if (sh === null || sh <= 0 || hr === null || hr <= 0) return null;
    const hpy = annualDays * sh * hr;
    return hpy > 0 ? cap / hpy : null;
  };
  const crush = rate(d.info.wor.crush_shift, d.info.wor.crush_hours);
  const plant = rate(d.info.wor.plant_shift, d.info.wor.plant_hours);
  if (crush === null && plant === null) return null;
  return {crush, plant, days:annualDays, cap};
}
function bal_source_rate(node, rates){
  if (!rates) return null;
  if (CRUSHER_CODES.includes(node.code) && rates.crush !== null) return rates.crush;
  return rates.plant;
}
function bal_water_from_moisture(tonnage, moist){
  if (tonnage === null || tonnage <= 0) return null;
  if (moist === null || moist < 0 || moist >= 100) return null;
  return tonnage * moist / (100 - moist);
}
function bal_solids_pct(tonnage, water){
  if (tonnage === null || tonnage <= 0) return null;
  if (water === null || water < 0) return null;
  if (water === 0) return 100;
  return 100 * tonnage / (tonnage + water);
}
function bal_conc_fraction(d, nodeUid){
  const node = d.crd.nodes.find(n=>n.uid === nodeUid);
  const cf = node && node.params ? parseNum(node.params.cf) : null;
  return (cf !== null && cf > 0 && cf < 1) ? cf : null;
}
function bal_is_conc_stream(d, stream){
  const outs = d.crd.streams.filter(s=>s.src === stream.src && !isWaterStream(s))
    .sort((a,b)=>a.uid < b.uid ? -1 : 1);
  return outs.length && outs[0].uid === stream.uid;
}
function bal_flotation_grade(d, nodeUid, feedGrade){
  const node = d.crd.nodes.find(n=>n.uid === nodeUid);
  const rec = node && node.params ? parseNum(node.params.rec) : null;
  const cf = bal_conc_fraction(d, nodeUid);
  if (rec === null || cf === null || feedGrade === null) return [null, null];
  if (rec <= 0 || rec > 100) return [null, null];
  const cg = rec * feedGrade / (100 * cf);
  const tg = feedGrade * (1 - rec/100) / Math.max(1e-9, 1 - cf);
  return [cg, tg];
}
function bal_crusher_rr(d, nodeUid){
  const node = d.crd.nodes.find(n=>n.uid === nodeUid);
  const rr = node && node.params ? parseNum(node.params.rr) : null;
  return (rr !== null && rr > 1) ? rr : DEFAULT_RR;
}

function bal_compute_tons(d){
  const out = {};
  for (const s of d.crd.streams) out[s.uid] = null;
  const nodes = {}; for (const n of d.crd.nodes) nodes[n.uid] = n;
  const feed = bal_feed_tonnage(d);
  const rates = bal_plant_rates(d);
  if ((!feed || feed <= 0 || !Object.keys(nodes).length) && (!rates || !Object.keys(nodes).length)) return out;
  const mat = d.crd.streams.filter(s=>!isWaterStream(s));
  const nodeIn = {}; for (const u of Object.keys(nodes)) nodeIn[u] = null;
  const outCount = {}; for (const u of Object.keys(nodes)) outCount[u] = 0;
  for (const s of mat) if (outCount[s.src] !== undefined) outCount[s.src]++;

  const resolveFeed = (u)=>{
    if (feed && feed > 0) return feed;
    const r = bal_source_rate(nodes[u], rates);
    return (r !== null && r !== undefined) ? r : null;
  };
  for (let iter=0; iter < d.crd.streams.length + d.crd.nodes.length + 3; iter++){
    let changed = false;
    for (const u of Object.keys(nodes)){
      if (nodeIn[u] !== null) continue;
      const inc = mat.filter(s=>s.dst === u);
      if (!inc.length){
        const r = resolveFeed(u);
        if (r !== null){ nodeIn[u] = r; changed = true; }
      } else {
        const vals = inc.map(s=>out[s.uid]);
        if (vals.every(v=>v !== null)){ nodeIn[u] = vals.reduce((a,b)=>a+b,0); changed = true; }
      }
    }
    for (const s of mat){
      if (out[s.uid] === null && nodeIn[s.src] !== null && nodeIn[s.src] !== undefined){
        const srcN = nodes[s.src];
        if (srcN && FLOT_CODES.includes(srcN.code)){
          const outs = mat.filter(x=>x.src === s.src).sort((a,b)=>a.uid < b.uid ? -1 : 1);
          const cf = bal_conc_fraction(d, s.src);
          if (outs.length && cf !== null){
            out[s.uid] = (s.uid === outs[0].uid)
              ? nodeIn[s.src] * cf
              : nodeIn[s.src] * (1 - cf) / (outs.length - 1);
            changed = true; continue;
          }
        }
        out[s.uid] = nodeIn[s.src] / Math.max(1, outCount[s.src] || 1);
        changed = true;
      }
    }
    if (!changed) break;
  }
  return out;
}

function bal_compute_water(d, tons){
  const out = {};
  for (const s of d.crd.streams) out[s.uid] = null;
  const nodes = {}; for (const n of d.crd.nodes) nodes[n.uid] = n;
  if (!Object.keys(nodes).length) return out;
  const moist = infoNum(d, "moisture");
  const mat = d.crd.streams.filter(s=>!isWaterStream(s));
  const wet = d.crd.streams.filter(s=>isWaterStream(s));
  const nodeIn = {}; for (const u of Object.keys(nodes)) nodeIn[u] = null;
  const outCount = {}; for (const u of Object.keys(nodes)) outCount[u] = 0;
  for (const s of mat) if (outCount[s.src] !== undefined) outCount[s.src]++;

  for (let iter=0; iter < d.crd.streams.length + d.crd.nodes.length + 3; iter++){
    let changed = false;
    for (const u of Object.keys(nodes)){
      if (nodeIn[u] !== null) continue;
      const inc = mat.filter(s=>s.dst === u);
      let add = 0;
      for (const w of wet){
        if (w.dst === u){ const v = parseNum(w.water); if (v !== null) add += Math.max(0, v); }
      }
      if (!inc.length){
        const oc = outCount[u] || 0;
        if (oc === 0 && wet.some(w=>w.src === u)){ nodeIn[u] = 0; changed = true; }
        else if (oc){
          const st0 = mat.find(s=>s.src === u);
          if (st0){
            const t = tons[st0.uid];
            if (t !== null && t !== undefined){
              nodeIn[u] = bal_water_from_moisture(t * oc, moist) || 0;
              changed = true;
            }
          }
        }
      } else {
        const vals = inc.map(s=>{
          const m = parseNum(s.water);
          return m !== null ? m : out[s.uid];
        });
        if (vals.every(v=>v !== null && v !== undefined)){ nodeIn[u] = vals.reduce((a,b)=>a+b,0) + add; changed = true; }
      }
    }
    for (const s of d.crd.streams){
      if (isWaterStream(s)){
        if (out[s.uid] === null){ const v = parseNum(s.water); out[s.uid] = v !== null ? v : 0; }
        continue;
      }
      if (out[s.uid] === null){
        const m = parseNum(s.water);
        if (m !== null){ out[s.uid] = m; changed = true; continue; }
        const ni = nodeIn[s.src];
        const srcN = nodes[s.src];
        if (ni !== null && ni !== undefined && srcN && FLOT_CODES.includes(srcN.code)){
          const fin = tons[s.src];
          const cf = bal_conc_fraction(d, s.src);
          if (fin && cf !== null && bal_is_conc_stream(d, s)){ out[s.uid] = ni * cf; changed = true; }
          else if (fin && cf !== null){ out[s.uid] = ni * (1 - cf); changed = true; }
          continue;
        }
        if (ni !== null && ni !== undefined){ out[s.uid] = ni / Math.max(1, outCount[s.src] || 1); changed = true; }
      }
    }
    if (!changed) break;
  }
  return out;
}

function bal_compute_grades(d, tons){
  const out = {};
  for (const s of d.crd.streams) out[s.uid] = null;
  const nodes = {}; for (const n of d.crd.nodes) nodes[n.uid] = n;
  if (!Object.keys(nodes).length) return out;
  const fGrade = infoNum(d, "grade");
  const mat = d.crd.streams.filter(s=>!isWaterStream(s));
  const nodeIn = {}; for (const u of Object.keys(nodes)) nodeIn[u] = null;
  for (let iter=0; iter < d.crd.streams.length + d.crd.nodes.length + 3; iter++){
    let changed = false;
    for (const u of Object.keys(nodes)){
      if (nodeIn[u] !== null) continue;
      const inc = mat.filter(s=>s.dst === u);
      if (!inc.length){
        if (fGrade !== null){ nodeIn[u] = [fGrade, null]; changed = true; }
        continue;
      }
      const vals = inc.map(s=>out[s.uid]);
      const tw = inc.map(s=>tons[s.uid]);
      if (vals.every(v=>v !== null)){
        let g;
        if (tw.every(t=>t !== null) && tw.reduce((a,b)=>a+(b||0),0) > 0){
          const sumT = tw.reduce((a,b)=>a+(b||0),0);
          g = vals.reduce((acc,v,i)=>acc + v*(tw[i]||0), 0) / sumT;
        } else {
          g = vals.reduce((a,b)=>a+b,0) / vals.length;
        }
        nodeIn[u] = [g, null];
        changed = true;
      }
    }
    for (const s of mat){
      if (out[s.uid] === null){
        const gi = nodeIn[s.src];
        if (gi === null || gi === undefined) continue;
        let g = gi[0];
        const srcN = nodes[s.src];
        if (srcN && FLOT_CODES.includes(srcN.code)){
          const [cg, tg] = bal_flotation_grade(d, s.src, g);
          if (cg !== null) g = bal_is_conc_stream(d, s) ? cg : tg;
        }
        out[s.uid] = g;
        changed = true;
      }
    }
    if (!changed) break;
  }
  return out;
}

function bal_compute_sizes(d, tons){
  const out = {};
  for (const s of d.crd.streams) out[s.uid] = null;
  const nodes = {}; for (const n of d.crd.nodes) nodes[n.uid] = n;
  if (!Object.keys(nodes).length) return out;
  const f80 = infoNum(d, "f80");
  const mat = d.crd.streams.filter(s=>!isWaterStream(s));
  const nodeIn = {}; for (const u of Object.keys(nodes)) nodeIn[u] = null;
  for (let iter=0; iter < d.crd.streams.length + d.crd.nodes.length + 3; iter++){
    let changed = false;
    for (const u of Object.keys(nodes)){
      if (nodeIn[u] !== null) continue;
      const inc = mat.filter(s=>s.dst === u);
      if (!inc.length){
        if (f80 !== null){ nodeIn[u] = f80; changed = true; }
        continue;
      }
      const vals = inc.map(s=>out[s.uid]);
      if (vals.every(v=>v !== null)){ nodeIn[u] = Math.max(...vals); changed = true; }
    }
    for (const s of mat){
      if (out[s.uid] === null){
        const ni = nodeIn[s.src];
        if (ni === null || ni === undefined) continue;
        const srcN = nodes[s.src];
        if (srcN && CRUSHER_CODES.includes(srcN.code)){
          out[s.uid] = ni / bal_crusher_rr(d, s.src);
        } else {
          out[s.uid] = ni;
        }
        changed = true;
      }
    }
    if (!changed) break;
  }
  return out;
}
function bal_stream_number(d, streamUid){
  const i = d.crd.streams.findIndex(s=>s.uid === streamUid);
  return i >= 0 ? i+1 : null;
}
function streamTypeName(key){
  if (!key || !STREAM_TYPES[key]) return tr("crd.type_default");
  const item = STR["styp."+key];
  return item ? (LANG === "en" ? item[1].split(" — ")[0] : item[0].split(" — ")[0]) : key;
}

/* ==================== FLOW CANVAS (shared by CRD & BFD) ==================== */
class FlowCanvas {
  /* opts: {getData: ()=>({nodes, streams, counterKey}), container, side:"crd"|"bfd",
            onDirty, linkColor(stream)=>css, nodeTitle(node)=>{tag,sub}, canLinkTypes:false} */
  constructor(opts){
    this.o = opts;
    this.scale = 1;
    this.tx = 40; this.ty = 40;
    this.sel = null;          // {type:'node'|'stream', uid}
    this.drag = null;
    this.linkDrag = null;
    this.render();
  }
  data(){ return this.o.getData(); }
  el(){ return this.o.container; }
  view(){ return this.el().querySelector(".cv-viewport"); }
  svg(){ return this.el().querySelector(".cvsvg"); }

  render(){
    this.el().innerHTML = `
      <div class="cv-viewport">
        <svg class="cvsvg"><g class="edges"></g></svg>
      </div>
      <div class="cv-zoom">
        <button class="btn" data-z="in" title="${esc(tr("crd.zoom_in"))}">＋</button>
        <button class="btn" data-z="out" title="${esc(tr("crd.zoom_out"))}">－</button>
        <button class="btn" data-z="fit" title="${esc(tr("crd.fit"))}">⛶</button>
      </div>`;
    const zoom = this.el().querySelector(".cv-zoom");
    zoom.addEventListener("click", e=>{
      const z = e.target.closest("[data-z]")?.dataset.z;
      if (z === "in") this.zoomAt(1.25);
      else if (z === "out") this.zoomAt(0.8);
      else if (z === "fit") this.fit();
    });
    const outer = this.el();
    outer.addEventListener("mousedown", e=>this.onMouseDown(e));
    outer.addEventListener("mousemove", e=>this.onMouseMove(e));
    window.addEventListener("mousemove", this._mm = e=>this.onMouseMove(e));
    window.addEventListener("mouseup", this._mu = e=>this.onMouseUp(e));
    outer.addEventListener("wheel", e=>{
      e.preventDefault();
      this.zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e);
    }, {passive:false});
    outer.addEventListener("dblclick", e=>{
      const nEl = e.target.closest(".cnode");
      if (nEl){ this.o.onNodeDblClick?.(nEl.dataset.uid); return; }
    });
    outer.addEventListener("contextmenu", e=>{
      const nEl = e.target.closest(".cnode");
      if (nEl){ e.preventDefault(); this.select("node", nEl.dataset.uid); this.o.onNodeCtx?.(nEl.dataset.uid, e.clientX, e.clientY); return; }
      const pEl = e.target.closest("path.stream");
      if (pEl){ e.preventDefault(); this.select("stream", pEl.dataset.uid); this.o.onStreamCtx?.(pEl.dataset.uid, e.clientX, e.clientY); return; }
    });
    this.applyTransform();
  }
  destroy(){
    window.removeEventListener("mousemove", this._mm);
    window.removeEventListener("mouseup", this._mu);
  }

  zoomAt(f, ev){
    const rect = this.el().getBoundingClientRect();
    const cx = ev ? ev.clientX - rect.left : rect.width/2;
    const cy = ev ? ev.clientY - rect.top : rect.height/2;
    const ns = Math.min(4, Math.max(0.25, this.scale * f));
    this.tx = cx - (cx - this.tx) * (ns / this.scale);
    this.ty = cy - (cy - this.ty) * (ns / this.scale);
    this.scale = ns;
    this.applyTransform();
  }
  applyTransform(){
    this.view().style.transform =
      `translate(${this.tx}px, ${this.ty}px) scale(${this.scale})`;
  }
  fit(){
    const d = this.data();
    const items = d.nodes;
    if (!items.length){ this.scale = 1; this.tx = 40; this.ty = 40; this.applyTransform(); return; }
    let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
    for (const n of items){
      x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
      x1 = Math.max(x1, n.x + 150); y1 = Math.max(y1, n.y + 60);
    }
    const rect = this.el().getBoundingClientRect();
    const w = Math.max(x1-x0, 100), h = Math.max(y1-y0, 100);
    this.scale = Math.min(2.2, Math.min(rect.width/(w+80), rect.height/(h+80)));
    this.tx = 40 - x0*this.scale + Math.max(0, (rect.width - w*this.scale)/2 - 40);
    this.ty = 40 - y0*this.scale + Math.max(0, (rect.height - h*this.scale)/2 - 40);
    this.applyTransform();
  }

  edges(d, uid, node){
    /* the 4 edge midpoints of a node (approx size 150x56) */
    const w = 150, h = 56;
    return {
      t:{x:node.x + w/2, y:node.y, side:"t"},
      b:{x:node.x + w/2, y:node.y + h, side:"b"},
      l:{x:node.x, y:node.y + h/2, side:"l"},
      r:{x:node.x + w, y:node.y + h/2, side:"r"},
    };
  }
  anchorPair(d, s){
    const a = d.nodes.find(n=>n.uid === s.src), b = d.nodes.find(n=>n.uid === s.dst);
    if (!a || !b) return null;
    const ea = this.edges(d, a.uid, a), eb = this.edges(d, b.uid, b);
    let best = null, bestD = 1e18;
    for (const ka of Object.keys(ea)) for (const kb of Object.keys(eb)){
      const dx = ea[ka].x - eb[kb].x, dy = ea[ka].y - eb[kb].y;
      const dist = dx*dx + dy*dy;
      if (dist < bestD){ bestD = dist; best = [ea[ka], eb[kb]]; }
    }
    return best;
  }

  paint(){
    const d = this.data();
    const vp = this.view();
    for (const el of vp.querySelectorAll(".cnode")) el.remove();
    for (const n of d.nodes){
      const t = this.o.nodeTitle(n);
      const el = document.createElement("div");
      el.className = "cnode" + (this.sel && this.sel.type==="node" && this.sel.uid===n.uid ? " sel" : "");
      el.dataset.uid = n.uid;
      el.style.left = n.x + "px"; el.style.top = n.y + "px";
      el.innerHTML = `
        <div class="nico">${t.icon||"⚙"}</div>
        <div class="tag">${esc(t.tag)}</div>
        <div class="nname">${esc(t.sub)}</div>
        <span class="chandle t" data-side="t"></span><span class="chandle b" data-side="b"></span>
        <span class="chandle l" data-side="l"></span><span class="chandle r" data-side="r"></span>`;
      vp.appendChild(el);
    }
    const g = this.svg().querySelector(".edges");
    g.innerHTML = "";
    const dark = UI.dark;
    for (const s of d.streams){
      const ap = this.anchorPair(d, s);
      if (!ap) continue;
      const [p1, p2] = ap;
      const selCls = (this.sel && this.sel.type==="stream" && this.sel.uid===s.uid) ? " sel" : "";
      const color = this.o.linkColor ? this.o.linkColor(s, dark) : "";
      const dashed = s.stype === "standby" ? 'stroke-dasharray="7 5"' : "";
      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("class", "stream" + selCls);
      path.dataset.uid = s.uid;
      path.setAttribute("d", `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`);
      path.setAttribute("stroke", color);
      if (dashed) path.setAttribute("stroke-dasharray","7 5");
      g.appendChild(path);
      /* manual arrow head (same color as the stream) */
      const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const ah = document.createElementNS("http://www.w3.org/2000/svg","path");
      ah.setAttribute("d", `M ${p2.x} ${p2.y} L ${p2.x - 11*Math.cos(ang-0.45)} ${p2.y - 11*Math.sin(ang-0.45)} L ${p2.x - 11*Math.cos(ang+0.45)} ${p2.y - 11*Math.sin(ang+0.45)} Z`);
      ah.setAttribute("fill", color);
      ah.setAttribute("pointer-events","none");
      g.appendChild(ah);
      const num = this.o.streamNumber ? this.o.streamNumber(s) : null;
      if (num !== null && num !== undefined){
        const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
        const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
        c.setAttribute("class","snumc");
        c.setAttribute("cx", mx); c.setAttribute("cy", my); c.setAttribute("r", 10);
        c.setAttribute("fill", "var(--node-bg)"); c.setAttribute("stroke", color); c.setAttribute("stroke-width","1.6");
        g.appendChild(c);
        const t = document.createElementNS("http://www.w3.org/2000/svg","text");
        t.setAttribute("class","snum");
        t.setAttribute("x", mx); t.setAttribute("y", my+3.6); t.setAttribute("text-anchor","middle");
        t.setAttribute("fill", "var(--text)"); t.textContent = num;
        g.appendChild(t);
      }
    }
  }

  select(type, uid_){
    this.sel = {type, uid:uid_};
    this.paint();
  }
  clearSel(){ this.sel = null; this.paint(); }

  onMouseDown(e){
    const chEl = e.target.closest(".chandle");
    const nEl = e.target.closest(".cnode");
    const pEl = e.target.closest("path.stream");
    if (chEl && nEl){
      e.preventDefault();
      this.linkDrag = {src:nEl.dataset.uid, x:e.clientX, y:e.clientY};
      this.el().classList.add("linking");
      return;
    }
    if (nEl){
      e.preventDefault();
      const d = this.data();
      const n = d.nodes.find(x=>x.uid === nEl.dataset.uid);
      if (!n) return;
      this.select("node", n.uid);
      const pt = this.toCanvas(e);
      this.drag = {uid:n.uid, dx:pt.x - n.x, dy:pt.y - n.y, moved:false};
      return;
    }
    if (pEl){
      this.select("stream", pEl.dataset.uid);
      return;
    }
    if (e.target.closest(".cv-zoom")) return;
    this.clearSel();
    this.pan = {x:e.clientX, y:e.clientY, tx:this.tx, ty:this.ty};
    this.el().classList.add("panning");
  }
  toCanvas(e){
    const rect = this.el().getBoundingClientRect();
    return {x:(e.clientX - rect.left - this.tx)/this.scale, y:(e.clientY - rect.top - this.ty)/this.scale};
  }
  onMouseMove(e){
    if (this.linkDrag){
      this._linkPos = this.toCanvas(e);
      this.paintLinkGhost();
      return;
    }
    if (this.drag){
      const pt = this.toCanvas(e);
      const d = this.data();
      const n = d.nodes.find(x=>x.uid === this.drag.uid);
      if (!n) return;
      n.x = Math.round(pt.x - this.drag.dx);
      n.y = Math.round(pt.y - this.drag.dy);
      this.drag.moved = true;
      this.paint();
      this.o.onDirty?.();
      return;
    }
    if (this.pan){
      this.tx = this.pan.tx + (e.clientX - this.pan.x);
      this.ty = this.pan.ty + (e.clientY - this.pan.y);
      this.applyTransform();
    }
  }
  paintLinkGhost(){
    const g = this.svg().querySelector(".edges");
    g.querySelector(".ghost")?.remove();
    if (!this._linkPos) return;
    const d = this.data();
    const a = d.nodes.find(n=>n.uid === this.linkDrag.src);
    if (!a) return;
    const ea = this.edges(d, a.uid, a);
    let best = null, bestD = 1e18;
    for (const k of Object.keys(ea)){
      const dx = ea[k].x - this._linkPos.x, dy = ea[k].y - this._linkPos.y;
      const dist = dx*dx+dy*dy;
      if (dist < bestD){ bestD = dist; best = ea[k]; }
    }
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("class","ghost");
    path.setAttribute("d", `M ${best.x} ${best.y} L ${this._linkPos.x} ${this._linkPos.y}`);
    path.setAttribute("stroke", "var(--port)");
    path.setAttribute("stroke-dasharray","5 4");
    path.setAttribute("fill","none");
    path.setAttribute("stroke-width","2");
    g.appendChild(path);
  }
  onMouseUp(e){
    if (this.linkDrag){
      const d = this.data();
      const target = document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".cnode");
      this.svg().querySelector(".ghost")?.remove();
      this.el().classList.remove("linking");
      if (target && target.dataset.uid && target.dataset.uid !== this.linkDrag.src){
        this.o.onLink?.(this.linkDrag.src, target.dataset.uid);
      }
      this.linkDrag = null; this._linkPos = null;
      return;
    }
    if (this.drag){
      if (this.drag.moved) this.o.onDirty?.();
      this.drag = null;
    }
    this.pan = null;
    this.el().classList.remove("panning");
  }
  deleteSelection(){
    if (!this.sel) return;
    this.o.onDelete?.(this.sel.type, this.sel.uid);
    this.sel = null;
    this.paint();
  }
}
</script>
<script>
/* ==================== NAV + ROUTER ==================== */
const NAV_ITEMS = [
  {code:"INF", i18n:"nav.info", ico:"🪪", page:"info"},
  {code:"EQP", i18n:"nav.eqp",  ico:"🗂",  page:"eqp"},
  {code:"CRD", i18n:"nav.crd",  ico:"⛓",  page:"crd"},
  {code:"BFD", i18n:"nav.bfd",  ico:"▦",  page:"bfd"},
  {code:"EQL", i18n:"nav.eql",  ico:"📋",  page:"eql"},
  {code:"PRD", i18n:"nav.prd",  ico:"📝",  page:"prd"},
  {code:"COD", i18n:"nav.cod",  ico:"#️⃣",  page:"cod"},
  {code:"LAB", i18n:"nav.lab",  ico:"⚗",  page:"lab"},
  {code:"THR", i18n:"nav.thr",  ico:"📦",  page:"soon3d"},
  {code:"PID", i18n:"nav.pid",  ico:"🌀",  page:"soonpid"},
  {code:"CAL", i18n:"nav.calc", ico:"🧮",  page:"calc"},
  {code:"CON", i18n:"nav.con",  ico:"💼",  page:"con"},
  {code:"ENG", i18n:"nav.eng",  ico:"📄",  page:"eng"},
  {code:"SOF", i18n:"nav.sof",  ico:"💻",  page:"sof"},
];
const NAV_ROOT = [
  {code:"CMP", i18n:"nav.cmp", ico:"🏢", page:"cmp"},
  {code:"LIB", i18n:"nav.lib", ico:"📚", page:"lib"},
];
const NAV_ADMIN = {code:"ADM", i18n:"nav.adm", ico:"🛡", page:"adm"};

let CURRENT_PAGE = "info";
let CRD_CANVAS = null, BFD_CANVAS = null;

function visibleNav(){
  const items = [...NAV_ITEMS];
  if (isRoot()) items.push(...NAV_ROOT);
  if (isAdmin()) items.push(NAV_ADMIN);
  return items;
}
function renderSidebar(){
  const nav = document.getElementById("side-nav");
  nav.innerHTML = "";
  for (const it of visibleNav()){
    const b = document.createElement("button");
    b.className = "nav-item" + (CURRENT_PAGE === it.page ? " active" : "");
    b.innerHTML = `<span class="nico">${it.ico}</span><span class="nlabel">${esc(tr(it.i18n))}</span><span class="ncode">${it.code}</span>`;
    b.addEventListener("click", ()=>go(it.page));
    nav.appendChild(b);
  }
}
function go(page){
  CURRENT_PAGE = page;
  CRD_CANVAS?.destroy(); CRD_CANVAS = null;
  BFD_CANVAS?.destroy(); BFD_CANVAS = null;
  renderSidebar();
  const root = document.getElementById("page-root");
  root.innerHTML = "";
  const fn = PAGES[page];
  if (fn) fn(root);
  root.scrollTop = 0;
}

/* ---------- palette dialog ---------- */
function openPalette(){
  const accents = [["teal","thm.teal"],["blue","thm.blue"],["green","thm.green"],
                   ["yellow","thm.yellow"],["pink","thm.pink"],["orange","thm.orange"]];
  const fonts = [["vazir","font.vazir"],["titr","font.titr"],["nazanin","font.nazanin"],
                 ["zar","font.zar"],["mitra","font.mitra"]];
  const sizes = [8,9,10,11,12,13,14,15,16];
  const sw = c => `<span style="display:inline-block;width:15px;height:15px;border-radius:4px;background:var(--accent);${c?`background:${(ACCENTS[c].light||{}).accent||'#0d9488'}`:''}"></span>`;
  const m = modal(tr("app.title_look") || tr("pal.colors"), `
    <label class="fld">${esc(tr("pal.colors"))}</label>
    <div class="flexrow">${accents.map(([k,ik]) =>
      `<button class="btn small ${UI.accent===k?"primary":""}" data-acc="${k}">${sw(k)} ${esc(tr(ik))}</button>`).join("")}</div>
    <label class="fld" style="margin-top:14px">${esc(tr("pal.fonts"))}</label>
    <div class="flexrow">${fonts.map(([k,ik]) =>
      `<button class="btn small ${UI.font===k?"primary":""}" data-font="${k}">${esc(tr(ik))}</button>`).join("")}</div>
    <label class="fld" style="margin-top:14px">${esc(tr("pal.size"))}</label>
    <div class="flexrow">${sizes.map(s =>
      `<button class="btn small ${UI.size===s?"primary":""}" data-size="${s}">${s}</button>`).join("")}</div>
    <div class="calc-note">${esc(tr("pal.per_user") || "")}</div>`,
    [{label:tr("btn.close")}]);
  m.addEventListener("click", e=>{
    const acc = e.target.closest("[data-acc]");
    const fnt = e.target.closest("[data-font]");
    const siz = e.target.closest("[data-size]");
    if (acc){ UI.accent = acc.dataset.acc; }
    else if (fnt){ UI.font = fnt.dataset.font; }
    else if (siz){ UI.size = parseInt(siz.dataset.size); }
    else return;
    applyTheme(); pushMyPrefs();
    m.querySelectorAll(".btn").forEach(b=>b.classList.remove("primary"));
    e.target.closest(".btn")?.classList.add("primary");
  });
}

/* ---------- projects dialog ---------- */
function openProjectsDialog(){
  const body = `
    <div style="color:var(--hint);font-size:12.5px;margin-bottom:10px">${esc(tr("prm.hint"))}</div>
    <div class="tblwrap" style="max-height:320px">
      <table class="tbl" id="prj-tbl">
        <thead><tr>
          <th>${esc(tr("col.name") || "Name")}</th><th>${esc(tr("prj.created"))}</th><th>${esc(tr("prj.updated"))}</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>`;
  const m = modal(tr("prm.title"), body, [
    {label:tr("btn.json"), onClick:()=>backupJson()},
    {label:tr("btn.restore"), onClick:()=>{
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";
      inp.addEventListener("change", ()=>{ if (inp.files[0]) restoreJson(inp.files[0]); });
      inp.click();
    }, keep:true},
    {label:tr("btn.close")},
  ], {wide:true});
  const tb = m.querySelector("tbody");
  function paint(){
    tb.innerHTML = "";
    if (!STATE.projects.length){
      tb.innerHTML = `<tr><td colspan="4" class="empty-note">—</td></tr>`;
      return;
    }
    for (const p of STATE.projects){
      const cur = p.uid === STATE.currentProject;
      const trEl = document.createElement("tr");
      if (cur) trEl.classList.add("sel");
      trEl.innerHTML = `
        <td>${esc(p.name)}${cur ? `<span style="color:var(--accent);font-weight:700">${esc(tr("prj.current_mark"))}</span>` : ""}</td>
        <td>${esc(p.created)}</td><td>${esc(p.updated)}</td>
        <td style="white-space:nowrap">
          <button class="btn small" data-a="open">${esc(tr("prm.open"))}</button>
          <button class="btn small" data-a="rename">${esc(tr("prm.rename"))}</button>
          <button class="btn small danger" data-a="del">${esc(tr("prm.delete"))}</button>
        </td>`;
      trEl.querySelector('[data-a="open"]').addEventListener("click", ()=>{
        STATE.currentProject = p.uid; saveState(); logAction("project.open", p.name);
        m.remove(); go(CURRENT_PAGE);
      });
      trEl.querySelector('[data-a="rename"]').addEventListener("click", ()=>{
        if (!requireWrite()) return;
        const nm = prompt(tr("msg.prj_new_name") || tr("btn.new"), p.name);
        if (nm && nm.trim()){ p.name = nm.trim(); touchProject(); paint(); }
      });
      trEl.querySelector('[data-a="del"]').addEventListener("click", ()=>{
        if (!requireWrite()) return;
        confirmBox(trf("msg.prj_delete", p.name) + "\n" + tr("msg.prj_delete_current"), ()=>{
          STATE.projects = STATE.projects.filter(x=>x.uid !== p.uid);
          if (STATE.currentProject === p.uid)
            STATE.currentProject = STATE.projects.length ? STATE.projects[0].uid : null;
          saveState(); paint(); go(CURRENT_PAGE);
        });
      });
      tb.appendChild(trEl);
    }
  }
  paint();
}

let EQP_SEARCH = "", EQP_SEL = null;
function renderEqp(root){
  const d = pdata();
  root.innerHTML = `
    <h1 class="h1">${esc(tr("eqp.h1"))}</h1>
    <p class="page-hint">${esc(tr("msg.code_hint"))}</p>
    <div class="two-col">
      <div class="card">
        <div class="card-head"><span class="badge">EQP</span><h3>${esc(tr("eqp.catalog"))}</h3>
          <div class="spacer"></div>
          <input class="inp searchbar" id="eqp-search" placeholder="${esc(tr("eqp.search"))}" value="${esc(EQP_SEARCH)}">
        </div>
        <div class="toolbox" id="eqp-catalog"></div>
      </div>
      <div class="card">
        <div class="card-head"><span class="badge gray">EQP</span><h3>${esc(tr("eqp.workspace"))}</h3></div>
        <div id="eqp-ws"></div>
      </div>
    </div>`;
  const cat = root.querySelector("#eqp-catalog");
  function paintCatalog(){
    cat.innerHTML = "";
    const q = EQP_SEARCH.trim().toLowerCase();
    for (const fam of CATALOG){
      const famMatch = !q || fam.fa.includes(q) || fam.en.toLowerCase().includes(q) || fam.code.toLowerCase().includes(q);
      const types = (fam.types && fam.types.length) ? fam.types
        : (fam.params ? [fam] : []);
      const items = types.filter(t=>
        famMatch || t.fa.includes(q) || t.en.toLowerCase().includes(q) || t.code.toLowerCase().includes(q));
      if (!items.length) continue;
      const box = document.createElement("div");
      box.className = "tb-family" + (q ? " open" : "");
      const head = document.createElement("button");
      head.className = "tb-fhead";
      head.innerHTML = `<span class="badge gray" style="font-size:10px">${fam.code}</span> ${esc(cname(fam))}`;
      head.addEventListener("click", ()=>box.classList.toggle("open"));
      const itemsEl = document.createElement("div");
      itemsEl.className = "tb-items";
      for (const t of items){
        const it = document.createElement("button");
        it.className = "tb-item" + (EQP_SEL === t.code ? " sel" : "");
        it.style.background = EQP_SEL === t.code ? "var(--sel-bg)" : "";
        it.innerHTML = `<b class="mono" style="font-size:11px;color:var(--accent)">${t.code}</b> ${esc(cname(t))}`;
        it.addEventListener("click", ()=>{
          EQP_SEL = t.code; paintCatalog();
        });
        itemsEl.appendChild(it);
      }
      box.appendChild(head); box.appendChild(itemsEl);
      cat.appendChild(box);
    }
  }
  paintCatalog();
  root.querySelector("#eqp-search").addEventListener("input", e=>{
    EQP_SEARCH = e.target.value; paintCatalog();
  });
  const ws = root.querySelector("#eqp-ws");
  function paintWs(){
    if (!d.eqp.length){
      ws.innerHTML = `<div class="empty-note">${esc(tr("eqp.empty"))}</div>`;
      return;
    }
    ws.innerHTML = `
      <div class="tblwrap"><table class="tbl">
        <thead><tr><th>${esc(tr("col.code"))}</th><th>${esc(tr("col.name"))}</th><th style="width:70px">${esc(tr("col.qty"))}</th><th>${esc(tr("col.note"))}</th><th></th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div id="eqp-params"></div>`;
    const tb = ws.querySelector("tbody");
    d.eqp.forEach((row, i)=>{
      const item = catalog_find(row.code);
      const trEl = document.createElement("tr");
      trEl.innerHTML = `
        <td><b class="mono" style="color:var(--accent)">${esc(row.code)}</b></td>
        <td>${esc(item ? cname(item) : row.code)}</td>
        <td><input class="inp" data-i="${i}" data-f="qty" value="${esc(row.qty||1)}" ${ro()}></td>
        <td><input class="inp" data-i="${i}" data-f="note" value="${esc(row.note||"")}" ${ro()}></td>
        <td><button class="btn small danger" data-del="${i}" ${ro()}>✕</button></td>`;
      tb.appendChild(trEl);
    });
    tb.querySelectorAll("[data-f]").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        if (!requireWrite()) return;
        d.eqp[+inp.dataset.i][inp.dataset.f] = inp.value;
        touchProject();
      });
    });
    tb.querySelectorAll("[data-del]").forEach(b=>{
      b.addEventListener("click", ()=>{
        if (!requireWrite()) return;
        d.eqp.splice(+b.dataset.del, 1); touchProject(); paintWs();
      });
    });
    const addBtn = document.createElement("button");
    addBtn.className = "btn primary tb-add";
    addBtn.textContent = "＋ " + tr("btn.add");
    addBtn.disabled = !isWritable() || !EQP_SEL;
    addBtn.addEventListener("click", ()=>{
      if (!requireWrite() || !EQP_SEL) return;
      const item = catalog_addable(EQP_SEL);
      if (!item) return;
      d.eqp.push({code:EQP_SEL, qty:1, note:"", params:{}});
      touchProject(); paintWs();
      toast(tr("msg.saved"));
    });
    ws.appendChild(addBtn);
    const paramsEl = ws.querySelector("#eqp-params");
    const selRow = d.eqp.find(r=>r.code === EQP_SEL);
    const item = catalog_find(EQP_SEL);
    if (selRow && item && item.params && item.params.length){
      paramsEl.innerHTML = `
        <div class="card" style="margin-top:14px">
          <div class="card-head"><span class="badge gray">${item.code}</span><h3>${esc(tr("eqp.params"))} — ${esc(cname(item))}</h3></div>
          <div class="fldrow">
            ${item.params.map(p=>`
              <div><label class="fld">${esc(LANG==="en"?p.en:p.fa)}${p.unit?` <span style="color:var(--hint)">(${p.unit})</span>`:""}</label>
              <input class="inp" data-pk="${p.key}" value="${esc(selRow.params[p.key]||"")}" ${ro()}></div>`).join("")}
          </div>
        </div>`;
      paramsEl.querySelectorAll("[data-pk]").forEach(inp=>{
        inp.addEventListener("change", ()=>{
          if (!requireWrite()) return;
          selRow.params[inp.dataset.pk] = inp.value;
          touchProject();
        });
      });
    }
  }
  paintWs();
}

function calcRun(id, vals){
  /* mirrors app/modules/calcs.py — throws {key} with i18n error key */
  const pos = (...kv)=>{ for (const v of Object.values(kv)) if (v === null || v <= 0) throw {key:"cal.err.val"}; };
  if (id === "mbl"){
    pos(vals.F, vals.f, vals.c, vals.t);
    if (Math.abs(vals.c - vals.t) < 1e-12) throw {key:"cal.err.c_eq_t"};
    const C = vals.F * (vals.f - vals.t) / (vals.c - vals.t);
    const T = vals.F - C;
    if (C <= 0 || T < 0) throw {key:"cal.err.neg"};
    return {C, T, R:(C*vals.c)/(vals.F*vals.f)*100};
  }
  if (id === "smp"){ pos(vals.d, vals.K, vals.n); return {M: vals.K * Math.pow(vals.d, vals.n)}; }
  if (id === "mpw"){
    pos(vals.wi, vals.f80, vals.p80, vals.q, vals.eta);
    const W = 10 * vals.wi * (1/Math.sqrt(vals.p80) - 1/Math.sqrt(vals.f80));
    if (W <= 0) throw {key:"cal.err.neg"};
    return {W, req: W*vals.q, inst: W*vals.q/vals.eta};
  }
  if (id === "fcv"){
    pos(vals.q, vals.t, vals.n, vals.eta);
    const vt = vals.q * vals.t / 60;
    return {vt, vc: vt / (vals.n * vals.eta)};
  }
  if (id === "thd"){
    pos(vals.s, vals.b);
    const A = vals.s * 24 / vals.b;
    return {A, D: Math.sqrt(4*A/Math.PI)};
  }
  if (id === "fpp"){
    pos(vals.q, vals.tc, vals.a, vals.th, vals.phi);
    const vc = vals.q * vals.tc / 60;
    const vpp = vals.a * (vals.th/1000) * vals.phi;
    return {vc, n: Math.ceil(vc/vpp)};
  }
}

        </div>`).join("")}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="badge gray">${esc(tr("cal.group.siz"))}</span></div>
      <div class="tiles">${CALC_DEFS.filter(x=>x.group==="siz").map(x=>`
        <div class="tile" data-c="${x.id}">
          <div class="tbadge"><span class="badge gray">${x.id.toUpperCase()}</span></div>
          <b>${esc(tr(x.card))}</b>
          <div class="outs">${esc(trf("cal.tile_outs", x.outs.map(o=>tr(o[1])).join("، ")))}</div>
        </div>`).join("")}
      </div>
    </div>`;
  root.querySelectorAll("[data-c]").forEach(t=>{
    t.addEventListener("click", ()=>{ CAL_OPEN = t.dataset.c; go("calc"); });
  });
}
function renderCalcOne(root, def){
  root.innerHTML = `
    <h1 class="h1">${esc(tr(def.card))}</h1>
    <p class="page-hint">
      <button class="btn small" id="cal-back">← ${esc(tr("cal.back_tiles"))}</button>
    </p>
    <div class="card" style="max-width:640px;margin-inline:auto">
      <div class="fldrow">
        ${def.fields.map(([k,ik,unit])=>`
          <div><label class="fld">${esc(tr(ik))} <span style="color:var(--hint)">(${unit})</span></label>
          <input class="inp" data-k="${k}" dir="ltr"></div>`).join("")}
      </div>
      <button class="btn primary" id="calc-btn" style="margin-top:16px">= ${esc(tr("btn.calc"))}</button>
      <div class="calc-out" id="calc-out" style="display:none"></div>
      <div class="calc-note" id="calc-err" style="color:var(--err)"></div>
      ${def.note ? `<div class="calc-note">${esc(tr(def.note))}</div>` : ""}
    </div>`;
  root.querySelector("#cal-back").addEventListener("click", ()=>{ CAL_OPEN = null; go("calc"); });
  root.querySelector("#calc-btn").addEventListener("click", ()=>{
    const out = root.querySelector("#calc-out");
    const err = root.querySelector("#calc-err");
    const vals = {};
    let ok = true;
    root.querySelectorAll("[data-k]").forEach(inp=>{
      const v = parseNum(inp.value);
      if (v === null) ok = false;
      vals[inp.dataset.k] = v;
      inp.style.borderColor = v === null ? "var(--err)" : "";
    });
    if (!ok){ err.textContent = tr("cal.err"); out.style.display = "none"; return; }
    try{
      const res = calcRun(def.id, vals);
      err.textContent = "";
      out.style.display = "block";
      out.innerHTML = def.outs.map(([k,ik,unit])=>`
        <div class="orow"><span>${esc(tr(ik))} <span style="color:var(--hint)">(${unit})</span></span><b>${fmtN(res[k], 3)}</b></div>`).join("");
    }catch(e){
      out.style.display = "none";
      err.textContent = tr(e.key || "cal.err");
    }
  });
}

<script>
/* ==================== PAGE: CRD (circuit design) ==================== */
function crdDefaultTag(d, code){
  const n = d.crd.nodes.filter(x=>x.code === code).length + 1;
  return code + "-" + String(n).padStart(3, "0");
}
function renderCrd(root){
  const d = pdata();
  const bfdSelected = d.bfd.nodes.map(n=>n.code);
  const filtered = bfdSelected.length;
  root.innerHTML = `
    <h1 class="h1">${esc(tr("crd.h1"))}</h1>
    <p class="page-hint">${esc(tr("crd.hint"))}<br>${esc(tr("crd.connect_hint"))}</p>
    <div class="two-col" style="grid-template-columns:270px 1fr">
      <div class="card">
        <div class="card-head"><span class="badge gray">TLB</span><h3>${esc(tr("crd.toolbox"))}</h3></div>
        ${filtered ? `<div class="calc-note">${esc(tr("crd.toolbox_bfd"))}</div>` : `<div class="calc-note">${esc(tr("crd.bfd_none"))}</div>`}
        <div class="toolbox" id="crd-tb"></div>
      </div>
      <div class="card canvas-card">
        <div class="canvas-toolbar">
          <span class="feedbox">${esc(tr("crd.feed"))}
            <input class="inp" id="crd-feed" dir="ltr" value="${esc(d.crd.feed||"")}" ${ro()}>
          </span>
          <button class="btn small" id="crd-feed-auto" ${ro()} title="${esc(tr("crd.feed_auto_tip"))}">⟳ ${esc(tr("crd.feed_auto"))}</button>
          <button class="btn small danger" id="crd-del" ${ro()}>🗑 ${esc(tr("crd.del_sel"))}</button>
          <button class="btn small danger" id="crd-clear" ${ro()}>${esc(tr("crd.clear"))}</button>
          <div class="grow"></div>
          <button class="btn small primary" id="crd-mbt">▦ ${esc(tr("mblt.title"))}</button>
          <button class="btn small" id="crd-csv">${esc(tr("mblt.export_csv"))}</button>
        </div>
        <div class="cv-outer tall" id="crd-canvas"></div>
        <div class="cv-stats" id="crd-stats"></div>
      </div>
    </div>`;

  /* toolbox grouped by BFD units when units are selected */
  const tb = root.querySelector("#crd-tb");
  const groups = [];
  if (filtered){
    for (const u of BFD_UNITS){
      if (!bfdSelected.includes(u.code)) continue;
      const fams = CATALOG.filter(f=>(f.types||[]).some(t=>unit_of_equipment(t.code) === u.code) ||
        (!f.types && f.params && unit_of_equipment(f.code) === u.code));
      const items = [];
      for (const f of fams){
        if (f.types && f.types.length){
          for (const t of f.types) if (unit_of_equipment(t.code) === u.code) items.push(t);
        } else if (f.params && unit_of_equipment(f.code) === u.code) items.push(f);
      }
      if (items.length) groups.push({unit:u, items});
    }
  } else {
    for (const f of CATALOG){
      const items = (f.types && f.types.length) ? f.types : (f.params ? [f] : []);
      if (items.length) groups.push({unit:null, fam:f, items});
    }
  }
  for (const g of groups){
    const box = document.createElement("div");
    box.className = "tb-family";
    const head = document.createElement("button");
    head.className = "tb-fhead";
    head.innerHTML = g.unit
      ? `<span class="badge gray" style="font-size:10px">${g.unit.code}</span> ${esc(tr(g.unit.i18n))}`
      : `<span class="badge gray" style="font-size:10px">${g.fam.code}</span> ${esc(cname(g.fam))}`;
    head.addEventListener("click", ()=>box.classList.toggle("open"));
    const itemsEl = document.createElement("div");
    itemsEl.className = "tb-items";
    for (const t of g.items){
      const b = document.createElement("button");
      b.className = "tb-item";
      b.innerHTML = `<b class="mono" style="font-size:11px;color:var(--accent)">${t.code}</b> ${esc(cname(t))}`;
      b.addEventListener("click", ()=>{
        if (!requireWrite()) return;
        d.crd.counter = (d.crd.counter||0) + 1;
        const n = {uid:"n"+d.crd.counter, code:t.code, tag:crdDefaultTag(d, t.code),
          x:40 + (d.crd.nodes.length % 6) * 160, y:40 + Math.floor(d.crd.nodes.length/6) * 100,
          params:{}};
        d.crd.nodes.push(n);
        touchProject(); paintAll();
      });
      itemsEl.appendChild(b);
    }
    box.appendChild(head); box.appendChild(itemsEl);
    tb.appendChild(box);
  }

  /* toolbar actions */
  const feed = root.querySelector("#crd-feed");
  feed.addEventListener("change", ()=>{
    if (!requireWrite()) return;
    d.crd.feed = feed.value; touchProject();
  });
  root.querySelector("#crd-feed-auto").addEventListener("click", ()=>{
    if (!requireWrite()) return;
    const rates = bal_plant_rates(d);
    const r = rates && rates.crush !== null ? rates.crush : (rates ? rates.plant : null);
    if (r === null || r === undefined){ toast(tr("crd.feed_auto_missing")); return; }
    d.crd.feed = String(Math.round(r * 100) / 100);
    touchProject(); paintAll();
    toast(tr("msg.saved"));
  });
  root.querySelector("#crd-del").addEventListener("click", ()=>{ if (requireWrite()) CRD_CANVAS.deleteSelection(); });
  root.querySelector("#crd-clear").addEventListener("click", ()=>{
    if (!requireWrite()) return;
    confirmBox(tr("msg.clear_confirm"), ()=>{
      d.crd.nodes = []; d.crd.streams = []; touchProject(); paintAll();
    });
  });
  root.querySelector("#crd-mbt").addEventListener("click", openMbt);
  root.querySelector("#crd-csv").addEventListener("click", exportMbtCsv);

  /* canvas */
  const holder = root.querySelector("#crd-canvas");
  CRD_CANVAS = new FlowCanvas({
    container: holder,
    side: "crd",
    getData: ()=>d.crd,
    nodeTitle: n=>{
      const item = catalog_find(n.code);
      return {tag:n.tag, sub:item?cname(item):n.code, icon:"⚙"};
    },
    linkColor: (s, dark)=>{
      const st = STREAM_TYPES[s.stype||""];
      return st ? (dark ? st.dark : st.light) : "";
    },
    streamNumber: s=>bal_stream_number(d, s.uid),
    onDirty: ()=>touchProject(),
    onLink: (src, dst)=>{
      d.crd.counter = (d.crd.counter||0) + 1;
      d.crd.streams.push({uid:"s"+d.crd.counter, src, dst, stype:"", name:"", water:"", manual:{}});
      touchProject(); paintAll();
    },
    onNodeDblClick: uid_=>{
      const n = d.crd.nodes.find(x=>x.uid === uid_);
      if (!n || !requireWrite()) return;
      const nm = prompt(tr("crd.tag_label"), n.tag);
      if (nm !== null && nm.trim()){ n.tag = nm.trim(); touchProject(); paintAll(); }
    },
    onNodeCtx: (uid_, x, y)=>{
      const n = d.crd.nodes.find(z=>z.uid === uid_);
      if (!n) return;
      const item = catalog_find(n.code);
      const items = [];
      if (isWritable()){
        items.push({label:tr("crd.menu_props"), onClick:()=>crdNodeProps(n, item)});
        items.push({label:tr("crd.rename_node"), onClick:()=>{
          const nm = prompt(tr("crd.tag_label"), n.tag);
          if (nm !== null && nm.trim()){ n.tag = nm.trim(); touchProject(); paintAll(); }
        }});
        items.push("-");
        items.push({label:tr("crd.menu_del_node"), onClick:()=>{
          d.crd.nodes = d.crd.nodes.filter(z=>z.uid !== n.uid);
          d.crd.streams = d.crd.streams.filter(s=>s.src !== n.uid && s.dst !== n.uid);
          touchProject(); paintAll();
        }});
      }
      if (items.length) ctxMenu(x, y, items);
    },
    onStreamCtx: (uid_, x, y)=>{
      const s = d.crd.streams.find(z=>z.uid === uid_);
      if (!s) return;
      const items = [];
      if (isWritable()){
        items.push({label:tr("crd.choose_type"), swatch:"var(--stream)", onClick:()=>crdStreamTypeMenu(s, x, y)});
        items.push({label:tr("crd.stream_props"), onClick:()=>crdStreamProps(s)});
        items.push({label:tr("crd.rename_stream"), onClick:()=>{
          const nm = prompt(tr("crd.stream_name_ph"), s.name || "");
          if (nm !== null){ s.name = nm.trim(); touchProject(); paintAll(); }
        }});
        items.push("-");
        items.push({label:tr("crd.menu_del_stream"), onClick:()=>{
          d.crd.streams = d.crd.streams.filter(z=>z.uid !== s.uid);
          touchProject(); paintAll();
        }});
      }
      if (items.length) ctxMenu(x, y, items);
    },
  });

  document.addEventListener("keydown", CRD_CANVAS._key = e=>{
    if (CURRENT_PAGE !== "crd" || !CRD_CANVAS) return;
    const tag = document.activeElement?.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (document.querySelector(".modal-back")) return;
    if (e.key === "Delete" && isWritable()) CRD_CANVAS.deleteSelection();
    if (e.key === "Escape") CRD_CANVAS.clearSel();
  });

  function paintAll(){
    CRD_CANVAS.paint();
    const st = root.querySelector("#crd-stats");
    if (st) st.innerHTML = `<span>${esc(trn("crd.stats", d.crd.nodes.length).replace("%d", d.crd.nodes.length).replace("— Streams: %d", "").trim())}</span>`;
    /* real stats */
    if (st) st.innerHTML = `<span>${LANG === "fa"
      ? `تجهیزات: ${d.crd.nodes.length} — جریان‌ها: ${d.crd.streams.length}`
      : `Equipment: ${d.crd.nodes.length} — Streams: ${d.crd.streams.length}`}</span>`;
  }
  paintAll();
}
function crdStreamTypeMenu(s, x, y){
  const items = [{label:tr("crd.type_default"), swatch:"var(--stream)", onClick:()=>{ s.stype=""; touchProject(); go("crd"); }}];
  for (const k of Object.keys(STREAM_TYPES)){
    items.push({label:tr("styp."+k).split(" — ")[0], swatch:STREAM_TYPES[k][UI.dark?"dark":"light"],
      onClick:()=>{ s.stype = k; touchProject(); go("crd"); }});
  }
  ctxMenu(x, y, items);
}
function crdNodeProps(n, item){
  const d = pdata();
  const isCrusher = CRUSHER_CODES.includes(n.code);
  const isFlot = FLOT_CODES.includes(n.code);
  const p = n.params || {};
  let fields = "";
  if (isCrusher){
    fields += `<div><label class="fld">${esc(tr("crd.rr"))}</label>
      <input class="inp" id="np-rr" dir="ltr" value="${esc(p.rr ?? "")}" placeholder="3.0"></div>
      <div class="calc-note">${esc(tr("crd.rr_note"))}</div>`;
  }
  if (isFlot){
    fields += `<div><label class="fld">${esc(tr("crd.rec"))}</label>
      <input class="inp" id="np-rec" dir="ltr" value="${esc(p.rec ?? "")}"></div>
      <div><label class="fld">${esc(tr("crd.cf"))}</label>
      <input class="inp" id="np-cf" dir="ltr" value="${esc(p.cf ?? "")}"></div>
      <div class="calc-note">${esc(tr("crd.flot_note"))}</div>`;
  }
  if (!fields) fields = `<div class="empty-note">${esc(tr("eqp.params"))}: ${esc(item?cname(item):n.code)}</div>`;
  const m = modal(tr("crd.props") + " — " + (item?cname(item):n.code) + ` [${esc(n.tag)}]`, `
    <div class="fldrow">${fields}</div>`,
    [{label:tr("ok"), kind:"primary", onClick:()=>{
      if (!requireWrite()) return;
      n.params = n.params || {};
      const rr = document.getElementById("np-rr");
      const rec = document.getElementById("np-rec");
      const cf = document.getElementById("np-cf");
      if (rr) n.params.rr = rr.value;
      if (rec) n.params.rec = rec.value;
      if (cf) n.params.cf = cf.value;
      touchProject(); go("crd");
    }}, {label:tr("cancel")}]);
  return m;
}
function crdStreamProps(s){
  const d = pdata();
  const isWater = isWaterStream(s);
  const m = modal(tr("crd.stream_props") + ` — ${esc(tr("crd.stream_short"))} ${bal_stream_number(d, s.uid)||""}`, `
    <div class="fldrow">
      <div><label class="fld">${esc(tr("crd.stream_name_ph"))}</label>
        <input class="inp" id="sp-name" value="${esc(s.name||"")}" ${ro()}></div>
      ${isWater ? "" : `<div><label class="fld">${esc(tr("mblt.row.size"))}</label>
        <input class="inp" id="sp-size" dir="ltr" value="${esc(s.manual?.size||"")}" ${ro()} placeholder="${esc(tr("mblt.auto_tip"))}"></div>`}
      <div><label class="fld">${esc(tr("crd.water_flow"))}</label>
        <input class="inp" id="sp-water" dir="ltr" value="${esc(s.water||"")}" ${ro()}></div>

      <div><label class="fld">${esc(tr("mblt.row.sg"))}</label>

    </div>

      if (!requireWrite()) return;

      if (grade) s.manual.grade = grade.value;
      if (sg) s.manual.sg = sg.value;
      touchProject(); go("crd");
    }}, {label:tr("cancel")}]);
}

/* ---------- mass-balance table (MBT) ---------- */
function mbtRows(){
  const d = pdata();
  const tons = bal_compute_tons(d);
  const waters = bal_compute_water(d, tons);
  const grades = bal_compute_grades(d, tons);
  const sizes = bal_compute_sizes(d, tons);
  return {d, tons, waters, grades, sizes};
}
function openMbt(){
  const {d, tons, waters, grades, sizes} = mbtRows();
  const sg = infoNum(d, "density");
  const streams = d.crd.streams;
  if (!streams.length){
    modal(tr("mblt.title"), `<div class="empty-note">${esc(tr("mblt.no_streams"))}</div>`, [{label:tr("btn.close")}]);
    return;
  }
  const f80 = infoNum(d, "f80"), moist = infoNum(d, "moisture"),
        grade0 = infoNum(d, "grade");
  const propLine = [
    f80 !== null ? trf("mblt.prop_f80", fmtN(f80)) : "",
    moist !== null ? trf("mblt.prop_moist", fmtN(moist)) : "",
    grade0 !== null ? trf("mblt.prop_grade", fmtN(grade0)) : "",
    sg !== null ? trf("mblt.prop_sg", fmtN(sg)) : "",
  ].filter(Boolean).join(" — ");
  const feedLine = bal_feed_tonnage(d) !== null
    ? trf("mblt.feed_line", fmtN(bal_feed_tonnage(d)))
    : tr("mblt.feed_missing");
  function rowCells(rw){
    return streams.map(s=>{
      if (rw === "stype") return `<td class="ro" style="font-size:11px">${esc(streamTypeName(s.stype))}</td>`;
      if (rw === "ton") return `<td class="num ro">${s.stype&&WATER_TYPES.includes(s.stype) ? "—" : fmtN(tons[s.uid])}</td>`;
      if (rw === "size"){
        const manual = s.manual?.size || "";
        const auto = sizes[s.uid];
        return `<td><input class="inp num" dir="ltr" data-uid="${s.uid}" data-f="size" value="${esc(manual)}" ${ro()} placeholder="${manual?"":esc(fmtN(auto))}" title="${esc(tr("mblt.auto_tip"))}"></td>`;
      }
      if (rw === "water"){
        const auto = waters[s.uid];
        return `<td><input class="inp num" dir="ltr" data-uid="${s.uid}" data-f="water" value="${esc(s.water||"")}" ${ro()} placeholder="${s.water?"":esc(fmtN(auto))}" title="${esc(tr("mblt.auto_tip"))}"></td>`;
      }
      if (rw === "solids"){
        const t = s.stype&&WATER_TYPES.includes(s.stype) ? null : tons[s.uid];
        const wv = parseNum(s.water) !== null ? parseNum(s.water) : waters[s.uid];
        return `<td class="num ro">${fmtN(bal_solids_pct(t, wv))}</td>`;
      }
      if (rw === "grade"){
        const manual = s.manual?.grade || "";
        const auto = grades[s.uid];
        return `<td><input class="inp num" dir="ltr" data-uid="${s.uid}" data-f="grade" value="${esc(manual)}" ${ro()} placeholder="${manual?"":esc(fmtN(auto))}" title="${esc(tr("mblt.auto_tip"))}"></td>`;
      }
      if (rw === "sg"){
        const manual = s.manual?.sg || "";
        return `<td><input class="inp num" dir="ltr" data-uid="${s.uid}" data-f="sg" value="${esc(manual)}" ${ro()} placeholder="${manual?"":esc(fmtN(sg))}" title="${esc(tr("mblt.auto_tip"))}"></td>`;
      }
      return "";
    }).join("");
